
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>REALM GO – Cinematic World</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110f;color:#e9fff5;font-family:Arial,sans-serif}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important;opacity:.65}
.maplibregl-ctrl-group{background:#10221f!important;border:1px solid #5b9c86!important}
.maplibregl-ctrl-group button{filter:invert(1)}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,8,9,.18) 75%,rgba(0,0,0,.68) 120%)}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;padding:18px 16px 30px;background:linear-gradient(#04100ff2,transparent);display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-size:23px;font-weight:900;letter-spacing:4px;color:#b9ffe4;text-shadow:0 0 12px #32ffb2,0 0 30px #00a878}
.logo small{display:block;font-size:9px;letter-spacing:3px;color:#a1c8bc;margin-top:4px}
.level{border:1px solid #59d6a5;background:#09251fcc;border-radius:12px;padding:8px 12px;font-size:11px;box-shadow:0 0 18px #00ff9b22}
.level strong{color:#7effc4;font-size:17px}
.panel{position:absolute;z-index:5;left:14px;right:14px;bottom:18px;border:1px solid #4b987a88;border-radius:19px;background:linear-gradient(145deg,#071d1beF,#07100ff2);box-shadow:0 0 30px #00d58b20,inset 0 0 24px #00d58b0b;padding:14px}
.status{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a6c8bc;margin-bottom:12px}
.status span:last-child{color:#6effbb}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action{border:1px solid #397d68;background:linear-gradient(145deg,#143c32,#091c19);border-radius:12px;color:#d9fff0;padding:12px 3px;font-size:10px;min-height:62px}
.action b{display:block;font-size:21px;margin-bottom:5px}
.action:active{transform:scale(.96);background:#205b47}
.message{font-size:12px;color:#b8d9cc;margin-top:11px;min-height:17px}
.gps{position:absolute;z-index:5;right:15px;bottom:205px;border:1px solid #75e5b5;background:#09251feF;color:#caffea;border-radius:50%;width:52px;height:52px;font-size:23px;box-shadow:0 0 20px #00ff9b55}
.compass{position:absolute;z-index:5;right:22px;top:90px;color:#a6ffe0;font-size:12px;text-shadow:0 0 8px #00ffad}
.player{width:34px;height:34px;border-radius:50%;border:2px solid #d8fff0;background:radial-gradient(circle,#eafff5 0,#54ffc0 25%,#087b58 65%,#052b21 100%);box-shadow:0 0 12px #00ffad,0 0 30px #00ffad;position:relative}
.player:after{content:"";position:absolute;inset:-9px;border:1px solid #71ffc5;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.7);opacity:0}}
.creature{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;background:radial-gradient(circle,#244b3c,#071b16);border:1px solid #8bffcb;box-shadow:0 0 14px #35ffad,0 0 35px #00a87588;animation:float 3s ease-in-out infinite}
.portal{width:40px;height:58px;border:3px solid #83ffe1;border-radius:50%;box-shadow:0 0 12px #00f5ff,0 0 30px #00d9ff,inset 0 0 15px #00d9ff;background:radial-gradient(ellipse,#b7fff833,#00b9ff22,transparent);animation:portal 2.5s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes portal{50%{filter:hue-rotate(40deg);transform:scale(1.08)}}
.toast{position:absolute;z-index:8;top:115px;left:50%;transform:translateX(-50%);background:#071c19ed;border:1px solid #62d6a5;border-radius:20px;padding:10px 16px;font-size:11px;white-space:nowrap;display:none}
#intro{position:absolute;z-index:10;inset:0;background:radial-gradient(ellipse at center,#14382e,#030a09 75%);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.introBox{max-width:350px}
.introLogo{font-size:35px;font-weight:900;letter-spacing:5px;color:#baffdf;text-shadow:0 0 25px #00ff9d}
.introBox p{color:#b2cfc3;line-height:1.6;font-size:13px}
.start{background:linear-gradient(90deg,#087b57,#20c98c);border:0;border-radius:12px;color:white;font-weight:bold;padding:15px 25px;font-size:13px;letter-spacing:2px;margin-top:12px}
</style>
</head>

<body>
<div id="map"></div>
<div class="vignette"></div>

<div class="topbar">
  <div class="logo">REALM GO<small>CINEMATIC WORLD ENGINE · 0.3</small></div>
  <div class="level">ÚROVEŇ<br><strong>01</strong></div>
</div>

<div class="compass">✦ SVĚT REALMŮ</div>
<button class="gps" onclick="locatePlayer()" title="Moje poloha">◎</button>

<div class="panel">
  <div class="status">
    <span id="locationStatus">SVĚT SE PROBOUZÍ</span>
    <span id="gpsStatus">GPS: VYPNUTO</span>
  </div>
  <div class="actions">
    <button class="action" onclick="scanWorld()"><b>⌖</b>SKENOVAT</button>
    <button class="action" onclick="showCreatures()"><b>✧</b>BYTOSTI</button>
    <button class="action" onclick="showPortals()"><b>◉</b>PORTÁLY</button>
    <button class="action" onclick="changeView()"><b>◇</b>POHLED</button>
  </div>
  <div class="message" id="message">Připoj se ke skutečnému světu a objevuj jeho tajemství.</div>
</div>

<div class="toast" id="toast"></div>

<div id="intro">
 <div class="introBox">
  <div class="introLogo">REALM GO</div>
  <p>Skutečný svět je jen začátek.<br>Za jeho hranicí se probouzí nové říše.</p>
  <p>Pro nejlepší zážitek povol přístup k poloze zařízení.</p>
  <button class="start" onclick="startGame()">VSTOUPIT DO SVĚTA</button>
 </div>
</div>

<script>
const START_CENTER=[14.7,49.4];

const map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/dark',
  center:START_CENTER,
  zoom:15,
  pitch:58,
  bearing:-18,
  maxPitch:75,
  antialias:true
});

map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');
map.addControl(new maplibregl.AttributionControl({compact:true}));

let playerMarker=null;
let playerPosition=null;
let creatureMarkers=[];
let portalMarkers=[];
let threeD=true;
let gpsWatch=null;
let gameStarted=false;

const creatures=[
 {name:'Lesní strážce',emoji:'🌿',type:'PŘÍRODA'},
 {name:'Jiskrový duch',emoji:'✨',type:'ENERGIE'},
 {name:'Noční poutník',emoji:'🌙',type:'STÍN'},
 {name:'Kamenný obr',emoji:'🪨',type:'ZEMĚ'},
 {name:'Plamenný tvor',emoji:'🔥',type:'OHEŇ'}
];

map.on('load',()=>{
  try{
    map.setFog({
      color:'#101d1b',
      'high-color':'#153b35',
      'space-color':'#020907',
      'horizon-blend':0.18,
      'star-intensity':0.12
    });
  }catch(e){}

  // Výšková data pro pokus o prostorový terén.
  try{
    map.addSource('realm-dem',{
      type:'raster-dem',
      tiles:['https://demotiles.maplibre.org/terrain-tiles/{z}/{x}/{y}.png'],
      tileSize:256,
      encoding:'terrarium',
      maxzoom:12
    });
    map.setTerrain({source:'realm-dem',exaggeration:1.25});
  }catch(e){
    console.log('Terén není dostupný:',e);
  }

  // Prostorové budovy z vektorových geografických dat.
  try{
    const layers=map.getStyle().layers;
    const firstSymbol=layers.find(l=>l.type==='symbol');
    map.addLayer({
      id:'realm-3d-buildings',
      source:'openmaptiles',
      'source-layer':'building',
      type:'fill-extrusion',
      minzoom:14,
      paint:{
        'fill-extrusion-color':[
          'interpolate',['linear'],['coalesce',['get','render_height'],8],
          0,'#173b32',
          12,'#285d4d',
          35,'#568875',
          80,'#8ebca1'
        ],
        'fill-extrusion-height':['coalesce',['get','render_height'],6],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
        'fill-extrusion-opacity':0.88,
        'fill-extrusion-vertical-gradient':true
      }
    },firstSymbol?firstSymbol.id:undefined);
  }catch(e){
    console.log('3D budovy se nepodařilo přidat:',e);
  }

  document.getElementById('locationStatus').textContent='SVĚT JE PŘIPRAVEN';
});

function startGame(){
  document.getElementById('intro').style.display='none';
  gameStarted=true;
  locatePlayer();
  showCreatures();
  showPortals();
  say('Vítej ve světě REALM GO. Hledám tvoji polohu…');
}

function say(text){
  document.getElementById('message').textContent=text;
}

function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text;
  el.style.display='block';
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.style.display='none',2600);
}

function locatePlayer(){
  if(!navigator.geolocation){
    say('Tento prohlížeč nepodporuje GPS.');
    return;
  }
  say('Zjišťuji tvoji aktuální polohu…');
  navigator.geolocation.getCurrentPosition(
    position=>{
      const lat=position.coords.latitude;
      const lon=position.coords.longitude;
      playerPosition=[lon,lat];
      updatePlayer();
      map.flyTo({center:playerPosition,zoom:17,pitch:62,speed:1.1});
      document.getElementById('gpsStatus').textContent='GPS: AKTIVNÍ';
      document.getElementById('locationStatus').textContent='POLOHA NAČTENA';
      say('Jsi ve skutečném světě. Rozhlédni se kolem sebe.');
      if(!gpsWatch){
        gpsWatch=navigator.geolocation.watchPosition(p=>{
          playerPosition=[p.coords.longitude,p.coords.latitude];
          updatePlayer();
        },()=>{},{
          enableHighAccuracy:true,
          maximumAge:5000,
          timeout:15000
        });
      }
      spawnAroundPlayer();
    },
    error=>{
      document.getElementById('gpsStatus').textContent='GPS: NEDOSTUPNÁ';
      const errors={
        1:'Přístup k poloze nebyl povolen. Povol GPS v nastavení prohlížeče.',
        2:'Poloha není momentálně dostupná.',
        3:'Zjišťování polohy trvalo příliš dlouho.'
      };
      say(errors[error.code]||'Nepodařilo se zjistit polohu.');
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function updatePlayer(){
  if(!playerPosition)return;
  const el=document.createElement('div');
  el.className='player';
  if(!playerMarker){
    playerMarker=new maplibregl.Marker({element:el,anchor:'center'})
      .setLngLat(playerPosition).addTo(map);
  }else{
    playerMarker.setLngLat(playerPosition);
  }
}

function randomOffset(){
  return (Math.random()-.5)*0.006;
}

function clearMarkers(markers){
  markers.forEach(m=>m.remove());
  markers.length=0;
}

function spawnAroundPlayer(){
  if(!playerPosition)return;
  clearMarkers(creatureMarkers);
  clearMarkers(portalMarkers);

  creatures.forEach((creature,i)=>{
    const element=document.createElement('div');
    element.className='creature';
    element.textContent=creature.emoji;
    element.title=creature.name;
    const coords=[
      playerPosition[0]+randomOffset(),
      playerPosition[1]+randomOffset()
    ];
    const marker=new maplibregl.Marker({element,anchor:'center'})
      .setLngLat(coords).addTo(map);
    element.addEventListener('click',()=>{
      say(creature.name+' · '+creature.type+' · Bytost objevena!');
      toast('✧ OBJEVIL JSI: '+creature.name.toUpperCase());
    });
    creatureMarkers.push(marker);
  });

  for(let i=0;i<2;i++){
    const element=document.createElement('div');
    element.className='portal';
    element.title='Tajemný portál';
    const coords=[
      playerPosition[0]+randomOffset()*1.5,
      playerPosition[1]+randomOffset()*1.5
    ];
    const marker=new maplibregl.Marker({element,anchor:'center'})
      .setLngLat(coords).addTo(map);
    element.addEventListener('click',()=>{
      say('Tajemný portál byl objeven. Jeho říše zatím čeká na odemčení.');
      toast('◉ OBJEVEN TAJEMNÝ PORTÁL');
    });
    portalMarkers.push(marker);
  }
}

function scanWorld(){
  if(!playerPosition){
    say('Nejdříve načti svoji GPS polohu.');
    locatePlayer();
    return;
  }
  spawnAroundPlayer();
  toast('⌖ SKENOVÁNÍ DOKONČENO');
  say('Oblast byla prozkoumána. Na mapě se objevily nové objekty.');
}

function showCreatures(){
  if(!playerPosition){
    say('Pro objevení bytostí nejdříve načti svoji polohu.');
    return;
  }
  if(creatureMarkers.length===0)spawnAroundPlayer();
  say('V okolí byly zaznamenány energetické stopy bytostí.');
  toast('✧ RADAR BYTOSTÍ AKTIVNÍ');
}

function showPortals(){
  if(!playerPosition){
    say('Portály se zobrazí po načtení GPS.');
    return;
  }
  if(portalMarkers.length===0)spawnAroundPlayer();
  say('Radar hledá průchody mezi jednotlivými říšemi.');
  toast('◉ PORTÁLOVÝ RADAR AKTIVNÍ');
}

function changeView(){
  threeD=!threeD;
  map.easeTo({
    pitch:threeD?62:0,
    bearing:threeD?-18:0,
    duration:1000
  });
  say(threeD?'Prostorový pohled aktivní.':'Pohled shora aktivní.');
}

map.on('click',e=>{
  if(!gameStarted)return;
  const coords=e.lngLat;
  say('Souřadnice objeveného místa: '+coords.lat.toFixed(5)+', '+coords.lng.toFixed(5));
});
</script>
</body>
</html>
