
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#183b2c">
<title>REALM GO 0.7</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#b9d9b0}
#map{position:absolute;inset:0}
#avatarCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

#map:after{
 content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
 background:linear-gradient(180deg,#d9f3d21c,transparent 25%,transparent 75%,#173e2b1c);
}

#loading{
 position:absolute;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;flex-direction:column;
 color:white;background:radial-gradient(circle at 50% 35%,#3d7653,#10271f 75%);
 transition:opacity .7s;
}
#loading.hidden{opacity:0;pointer-events:none}
.logo{font-size:39px;font-weight:900;letter-spacing:5px;text-shadow:0 0 25px #9affbd}
.logo span{color:#aaffbd}
.sub{font-size:10px;letter-spacing:4px;margin-top:10px;color:#c5f1d1}
.loader{width:42px;height:42px;border:3px solid #ffffff30;border-top-color:#aaffbd;border-radius:50%;animation:spin 1s linear infinite;margin-top:30px}
@keyframes spin{to{transform:rotate(360deg)}}

.panel{
 color:white;background:linear-gradient(145deg,#173d2eeF,#10291fee);
 border:1px solid #b5f3c66b;border-radius:16px;padding:10px 13px;
 box-shadow:0 6px 22px #102b1d55;backdrop-filter:blur(12px);
}
#topbar{
 position:absolute;z-index:20;top:calc(10px + env(safe-area-inset-top));
 left:12px;right:12px;display:flex;justify-content:space-between;
 pointer-events:none;
}
#playerInfo{font-size:12px;line-height:1.6}
#playerInfo strong{font-size:15px;color:#b5ffc9}
#level{color:#d1ead8;font-size:11px}
#compass{font-size:22px}

#bottom{
 position:absolute;z-index:20;bottom:calc(13px + env(safe-area-inset-bottom));
 left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;
 pointer-events:none;
}
#bottom .panel{pointer-events:auto}
#locationStatus{font-size:11px;color:#d2edda;max-width:190px}
.actions{display:flex;gap:9px}
.action{
 width:49px;height:49px;border-radius:16px;
 border:1px solid #b5f3c6a0;color:white;font-size:22px;
 background:linear-gradient(145deg,#34704c,#153a2b);
 box-shadow:0 5px 15px #0004;
}
.action:active{transform:scale(.93)}

.mapbtn{
 position:absolute;z-index:25;right:13px;width:43px;height:43px;
 border-radius:14px;border:1px solid #ffffff80;
 background:#173d2eeF;color:white;font-size:21px;
 box-shadow:0 4px 12px #0003;
}
#gpsButton{top:94px}
#zoomControls{position:absolute;z-index:25;right:13px;top:145px;display:flex;flex-direction:column;gap:7px}
.zoom{width:43px;height:43px;border-radius:14px;border:1px solid #ffffff80;background:#173d2eeF;color:white;font-size:24px}

#message{
 position:absolute;z-index:40;top:85px;left:50%;transform:translateX(-50%);
 background:#173d2eee;color:white;padding:11px 16px;border-radius:13px;
 border:1px solid #b5f3c6;max-width:85%;font-size:12px;text-align:center;
 opacity:0;pointer-events:none;transition:opacity .3s;
}
#message.show{opacity:1}

.item-marker{
 width:48px;height:57px;display:flex;align-items:center;justify-content:center;
 position:relative;filter:drop-shadow(0 5px 4px #1a352b88);
}
.item-symbol{
 font-size:30px;position:relative;z-index:2;
 text-shadow:0 2px 3px #23432d;
}
.item-shadow{
 position:absolute;bottom:1px;width:27px;height:7px;border-radius:50%;
 background:#253b2a66;
}
#debug{
 display:none;position:absolute;z-index:200;left:10px;right:10px;top:40%;
 padding:16px;border-radius:13px;background:#351919ed;color:white;
 font-size:12px;overflow-wrap:anywhere;line-height:1.5;
}
#debug button{padding:9px 15px;border:0;border-radius:8px;margin-top:12px}
</style>
</head>

<body>
<div id="map"></div>
<canvas id="avatarCanvas"></canvas>

<div id="loading">
 <div class="logo">REALM <span>GO</span></div>
 <div class="sub">EXPLORE THE LIVING WORLD</div>
 <div class="loader"></div>
 <div id="loadingText" style="margin-top:15px;font-size:12px">Vytvářím svět...</div>
</div>

<div id="topbar">
 <div class="panel" id="playerInfo">
  <strong>CESTOVATEL</strong><br>
  <span id="level">ÚROVEŇ 1 · 0 XP</span>
 </div>
 <div class="panel" id="compass">🧭</div>
</div>

<button class="mapbtn" id="gpsButton">◎</button>
<div id="zoomControls">
 <button class="zoom" id="zoomIn">+</button>
 <button class="zoom" id="zoomOut">−</button>
</div>

<div id="message"></div>

<div id="bottom">
 <div class="panel"><div id="locationStatus">Čekám na GPS...</div></div>
 <div class="actions">
  <button class="action" id="inventoryButton">🎒</button>
  <button class="action" id="worldButton">🌍</button>
 </div>
</div>

<div id="debug">
 <strong>REALM GO – chyba</strong>
 <div id="debugText"></div>
 <button onclick="location.reload()">Obnovit hru</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);

let map=null,renderer=null,scene=null,camera=null,avatar=null;
let parts={},playerPosition=null,lastPosition=null;
let heading=0,walking=false,worldItemsCreated=false;
let xp=0,level=1,markers=[];
let playerCentered=false;

function message(t){
 const e=$("message");
 e.textContent=t;e.classList.add("show");
 setTimeout(()=>e.classList.remove("show"),2600);
}

function error(t){
 $("debugText").textContent=t;
 $("debug").style.display="block";
 $("loading").classList.add("hidden");
}

window.addEventListener("error",e=>{
 console.error(e);
 if(!map)error("Chyba: "+e.message);
});

window.addEventListener("unhandledrejection",e=>console.error(e.reason));

function closeLoading(t){
 $("loadingText").textContent=t||"Svět připraven";
 $("loading").classList.add("hidden");
 setTimeout(()=>$("loading").style.display="none",750);
}

/* MAPA */

function startMap(){
 if(typeof maplibregl==="undefined"){
  error("MapLibre se nenačetl. Zkontroluj internetové připojení.");
  return;
 }

 try{
  map=new maplibregl.Map({
   container:"map",
   style:"https://tiles.openfreemap.org/styles/liberty",
   center:[15.0,49.0],
   zoom:14,
   pitch:55,
   bearing:0,
   maxPitch:60,
   minZoom:3,
   maxZoom:21,
   antialias:true,
   attributionControl:false,
   dragRotate:false,
   touchPitch:false
  });

  map.addControl(new maplibregl.AttributionControl({compact:true}));

  // Udržujeme sever nahoře – mapa se sama nepřetáčí.
  map.touchZoomRotate.disableRotation();
  map.dragRotate.disable();
  map.keyboard.disableRotation();

  map.on("load",()=>{
   $("loadingText").textContent="Načítám krajinu...";
   map.setPitch(55);
   map.setBearing(0);

   // Jemná atmosféra
   try{
    map.setFog({
     color:"#e5f1df",
     "high-color":"#b6d9bd",
     "space-color":"#d6e9d3",
     "horizon-blend":0.08,
     "star-intensity":0
    });
   }catch(e){console.log("Fog není dostupný",e)}

   closeLoading("Vítej v REALM GO");
   $("locationStatus").textContent="Mapa připravena · Čekám na GPS";
  });

  map.on("error",e=>console.warn("Mapový podklad:",e.error||e));

 }catch(e){
  error("Mapu nelze spustit: "+e.message);
 }
}

/* PŘEDMĚTY */

function addItem(lng,lat,emoji,name){
 const el=document.createElement("div");
 el.className="item-marker";
 el.innerHTML='<span class="item-symbol">'+emoji+'</span><span class="item-shadow"></span>';

 const marker=new maplibregl.Marker({
  element:el,anchor:"bottom"
 }).setLngLat([lng,lat]).addTo(map);

 el.addEventListener("click",()=>{
  message("✨ "+name+" · +10 XP");
  addXP(10);
  marker.remove();
 });

 markers.push(marker);
}

function createWorldItems(){
 if(worldItemsCreated||!playerPosition||!map)return;
 worldItemsCreated=true;

 const [lng,lat]=playerPosition;
 const items=[
  [0.00045,0.00025,"💎","Krystal energie"],
  [-0.00055,0.0003,"🌿","Bylina života"],
  [0.0003,-0.00055,"🪙","Starověká mince"],
  [-0.0004,-0.00045,"✨","Magická esence"],
  [0.00075,0.0001,"📦","Tajemná schránka"]
 ];

 items.forEach(i=>addItem(lng+i[0],lat+i[1],i[2],i[3]));
}

/* ZKUŠENOSTI */

function addXP(n){
 xp+=n;
 while(xp>=level*100){
  xp-=level*100;
  level++;
  message("🌟 Nová úroveň: "+level);
 }
 $("level").textContent="ÚROVEŇ "+level+" · "+xp+" XP";
}

/* 3D AVATAR */

function createAvatar(){
 if(typeof THREE==="undefined"){
  console.warn("Three.js není dostupné – hra poběží bez 3D avatara.");
  return;
 }

 try{
  renderer=new THREE.WebGLRenderer({
   canvas:$("avatarCanvas"),alpha:true,antialias:true
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x000000,0);

  scene=new THREE.Scene();
  camera=new THREE.OrthographicCamera(
   -innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,0.1,1000
  );
  camera.position.set(0,0,150);
  camera.lookAt(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff,1.7));

  const sun=new THREE.DirectionalLight(0xffffff,2);
  sun.position.set(-40,80,100);
  scene.add(sun);

  const fill=new THREE.DirectionalLight(0x9bdcff,0.6);
  fill.position.set(50,20,60);
  scene.add(fill);

  avatar=new THREE.Group();
  scene.add(avatar);

  const mat=(color,roughness=.8,metalness=0)=>
   new THREE.MeshStandardMaterial({color,roughness,metalness});

  const green=mat(0x27864b);
  const dark=mat(0x164b31);
  const skin=mat(0xe8b98b);
  const leather=mat(0x70472c);
  const gold=mat(0xf3c95a,.35,.5);
  const boots=mat(0x30251e);

  function part(g,m,parent,x,y,z){
   const o=new THREE.Mesh(g,m);
   o.position.set(x,y,z);
   o.castShadow=true;
   parent.add(o);
   return o;
  }

  // Stín
  const shadow=part(
   new THREE.CircleGeometry(18,32),
   new THREE.MeshBasicMaterial({color:0x172b1c,transparent:true,opacity:.34}),
   avatar,0,1,-8
  );
  shadow.scale.set(1.5,.42,1);

  // Plášť
  const cape=part(new THREE.ConeGeometry(18,48,9),dark,avatar,0,39,-4);
  cape.rotation.x=Math.PI;

  // Tělo
  part(new THREE.CapsuleGeometry(10,20,5,12),green,avatar,0,49,3);

  // Batoh
  part(new THREE.BoxGeometry(15,19,9),leather,avatar,0,54,-9);

  // Hlava a kapuce
  part(new THREE.SphereGeometry(10,24,20),skin,avatar,0,77,5);
  part(new THREE.SphereGeometry(12,24,18),dark,avatar,0,81,1);

  // Oči
  const eye=mat(0x25251c);
  part(new THREE.SphereGeometry(1.2,8,8),eye,avatar,-3,77,14);
  part(new THREE.SphereGeometry(1.2,8,8),eye,avatar,3,77,14);

  // Ramena
  part(new THREE.SphereGeometry(6,12,12),green,avatar,-12,57,3);
  part(new THREE.SphereGeometry(6,12,12),green,avatar,12,57,3);

  // Ruce
  const leftArm=new THREE.Group();
  leftArm.position.set(-13,55,4);
  avatar.add(leftArm);
  part(new THREE.CapsuleGeometry(4,15,4,8),green,leftArm,0,-10,0);

  const rightArm=new THREE.Group();
  rightArm.position.set(13,55,4);
  avatar.add(rightArm);
  part(new THREE.CapsuleGeometry(4,15,4,8),green,rightArm,0,-10,0);

  // Nohy
  const leftLeg=new THREE.Group();
  leftLeg.position.set(-6,31,4);
  avatar.add(leftLeg);
  part(new THREE.CapsuleGeometry(4,13,4,8),leather,leftLeg,0,-9,0);
  part(new THREE.BoxGeometry(10,7,15),boots,leftLeg,0,-20,4);

  const rightLeg=new THREE.Group();
  rightLeg.position.set(6,31,4);
  avatar.add(rightLeg);
  part(new THREE.CapsuleGeometry(4,13,4,8),leather,rightLeg,0,-9,0);
  part(new THREE.BoxGeometry(10,7,15),boots,rightLeg,0,-20,4);

  // Znak na hrudi
  part(new THREE.OctahedronGeometry(4),gold,avatar,0,53,14);

  parts={leftArm,rightArm,leftLeg,rightLeg,shadow,cape};
  return true;

 }catch(e){
  console.error("Avatar:",e);
  return false;
 }
}

/* GPS */

function startGPS(){
 if(!navigator.geolocation){
  $("locationStatus").textContent="GPS není podporována";
  return;
 }

 $("locationStatus").textContent="Zjišťuji polohu...";

 navigator.geolocation.watchPosition(
  onPosition,
  gpsError,
  {enableHighAccuracy:true,maximumAge:3000,timeout:20000}
 );
}

function onPosition(pos){
 const lng=pos.coords.longitude;
 const lat=pos.coords.latitude;

 if(!Number.isFinite(lng)||!Number.isFinite(lat))return;

 playerPosition=[lng,lat];

 if(lastPosition){
  const dx=lng-lastPosition[0];
  const dy=lat-lastPosition[1];
  const distance=Math.hypot(dx,dy);

  if(distance>0.000002){
   heading=Math.atan2(dx,dy);
   walking=true;
  }else{
   walking=false;
  }
 }

 lastPosition=[lng,lat];

 $("locationStatus").textContent=
  "GPS aktivní · přesnost "+Math.round(pos.coords.accuracy)+" m";

 if(map&&map.loaded()){
  if(!playerCentered){
   playerCentered=true;
   map.flyTo({center:playerPosition,zoom:18,pitch:55,bearing:0,duration:1800});
   setTimeout(createWorldItems,2000);
  }
 }
}

function gpsError(e){
 const texts={
  1:"Povol přístup k poloze.",
  2:"GPS poloha není dostupná.",
  3:"GPS odpověděla příliš pozdě."
 };
 $("locationStatus").textContent=texts[e.code]||"Chyba GPS";
}

/* AVATAR – VŽDY VZPŘÍMENÝ */

function updateAvatar(){
 if(!avatar||!playerPosition||!map||!map.loaded())return;

 const p=map.project(playerPosition);

 avatar.position.set(
  p.x-innerWidth/2,
  innerHeight/2-p.y,
  0
 );

 // ZÁSADNÍ OPRAVA:
 // Tělo se nikdy nenaklání. Směr se mění kolem svislé osy Y.
 avatar.rotation.x=0;
 avatar.rotation.z=0;
 avatar.rotation.y=heading;

 const t=performance.now()*.008;

 if(walking){
  parts.leftLeg.rotation.x=Math.sin(t)*.42;
  parts.rightLeg.rotation.x=-Math.sin(t)*.42;
  parts.leftArm.rotation.x=-Math.sin(t)*.3;
  parts.rightArm.rotation.x=Math.sin(t)*.3;
  avatar.position.y+=Math.abs(Math.sin(t*2))*1.5;
 }else{
  parts.leftLeg.rotation.x=0;
  parts.rightLeg.rotation.x=0;
  parts.leftArm.rotation.x=0;
  parts.rightArm.rotation.x=0;
  avatar.position.y+=Math.sin(t*.4)*.8;
 }
}

function animate(){
 requestAnimationFrame(animate);
 if(renderer&&scene&&camera){
  updateAvatar();
  renderer.render(scene,camera);
 }
}

/* OVLÁDÁNÍ */

$("gpsButton").onclick=()=>{
 if(playerPosition&&map){
  map.flyTo({center:playerPosition,zoom:18,pitch:55,bearing:0,duration:1200});
 }else startGPS();
};

$("zoomIn").onclick=()=>map&&map.zoomIn();
$("zoomOut").onclick=()=>map&&map.zoomOut();

$("inventoryButton").onclick=()=>message("🎒 Batoh – zatím prázdný");

$("worldButton").onclick=()=>{
 if(map){
  map.easeTo({pitch:55,bearing:0,duration:800});
  message("🌍 Živý svět REALM GO");
 }
};

window.addEventListener("resize",()=>{
 if(!renderer||!camera)return;
 renderer.setSize(innerWidth,innerHeight);
 camera.left=-innerWidth/2;
 camera.right=innerWidth/2;
 camera.top=innerHeight/2;
 camera.bottom=-innerHeight/2;
 camera.updateProjectionMatrix();
});

/* START */

function boot(){
 startMap();
 createAvatar();
 animate();
 startGPS();

 setTimeout(()=>{
  if(!$("loading").classList.contains("hidden")){
   closeLoading("Mapa se načítá na pozadí...");
  }
 },12000);
}

boot();

})();
</script>
</body>
</html>
