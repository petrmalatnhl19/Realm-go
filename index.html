
<!DOCTYPE html>

<style>

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9c99a;color:#fff;font-family:Arial,sans-serif}
#map{position:absolute;inset:0}
#avatarCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.maplibregl-ctrl-attrib{font-size:9px!important;opacity:.65}
.maplibregl-ctrl-group{background:#153b2d!important;border:1px solid #8cd5a5!important}
.maplibregl-ctrl-group button{filter:invert(1)}

.topbar{
 position:absolute;z-index:6;top:0;left:0;right:0;
 padding:18px 16px 30px;
 background:linear-gradient(#102d20eF,transparent);
 display:flex;justify-content:space-between;align-items:flex-start
}
.logo{
 font-size:23px;font-weight:900;letter-spacing:4px;

}
.logo small{display:block;font-size:9px;letter-spacing:3px;color:#e0f7df;margin-top:4px}
.level{

}

.panel{

.status span:last-child{color:#9effba}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action{

}
.action b{display:block;font-size:21px;margin-bottom:5px}
.action:active{transform:scale(.96)}
.message{font-size:12px;color:#d4efda;margin-top:11px;min-height:17px}

.gps{

 border:1px solid #a5e9b6;background:#153d2deF;color:#eaffef;
 border-radius:50%;width:52px;height:52px;font-size:23px;
 box-shadow:0 0 20px #38b76a55
}
.toast{
 position:absolute;z-index:8;top:115px;left:50%;transform:translateX(-50%);

 padding:10px 16px;font-size:11px;white-space:nowrap;display:none
}
.compass{position:absolute;z-index:6;right:22px;top:90px;color:#f1fff0;font-size:12px;text-shadow:0 1px 5px #153d2d}

.world-item{
 position:relative;display:block;
 pointer-events:auto
}
.item-shadow{
 position:absolute;bottom:0;left:50%;
 width:34px;height:9px;margin-left:-17px;
 border-radius:50%;background:rgba(0,0,0,.55);
 filter:blur(3px)
}
.crystal{width:44px;height:60px}
.crystal-shape{
 position:absolute;bottom:7px;left:10px;width:25px;height:45px;
 background:linear-gradient(110deg,#c5fff0,#23dca3 35%,#087e88 70%,#caffef);
 clip-path:polygon(50% 0,100% 32%,76% 100%,24% 100%,0 32%);
 filter:drop-shadow(0 0 5px #36d9b0)
}
.crystal-shine{
 position:absolute;bottom:15px;left:18px;width:5px;height:29px;
 background:#fff;opacity:.8;
 clip-path:polygon(50% 0,100% 100%,0 100%)
}
.portal-object{width:62px;height:82px}
.portal-ring{
 position:absolute;bottom:9px;left:12px;width:38px;height:65px;
 border:4px solid #83ffe1;border-radius:50%;
 box-shadow:0 0 10px #00b9d9,inset 0 0 12px #00d9ff,0 0 24px #00a9c7;
 background:radial-gradient(ellipse,#b7fff822,#00b9ff18,transparent)
}
.portal-base{
 position:absolute;bottom:2px;left:7px;width:48px;height:10px;
 border-radius:50%;background:radial-gradient(ellipse,#83ffe1,#087e70 60%,#031a19);
 box-shadow:0 0 12px #00c9d9
}
.wood-item{width:45px;height:53px}
.wood-shape{

}
.wood-shape:after{

}

#intro{
 position:absolute;z-index:10;inset:0;

}
.introBox{max-width:350px}
.introLogo{

}

<body>

<div id="map"></div>
<canvas id="avatarCanvas"></canvas>

<div class="topbar">
 <div class="logo">REALM GO<small>TRUE 3D AVATAR · 0.5</small></div>
 <div class="level">ÚROVEŇ<br><strong>01</strong></div>
</div>

<div class="compass">✦ SVĚT REALMŮ</div>

<div class="panel">

  <p>Povol přístup k poloze zařízení.</p>
  <button class="start" onclick="startGame()">VSTOUPIT DO SVĚTA</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

const START_CENTER=[14.7,49.4];

const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/bright',
 center:START_CENTER,
 zoom:15,
 pitch:58,
 bearing:-18,
 maxPitch:75,
 antialias:true
});

map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');
map.addControl(new maplibregl.AttributionControl({compact:true}));

let playerPosition=null;
let gpsWatch=null;
let itemMarkers=[];
let objectsCreated=false;
let gameStarted=false;
let threeD=true;
let lastPosition=null;
let moving=false;
let lastMoveTime=0;
let targetHeading=0;

/* THREE.JS SCÉNA */

const canvas=document.getElementById('avatarCanvas');

const renderer=new THREE.WebGLRenderer({
 canvas:canvas,
 alpha:true,
 antialias:true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight,false);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();

const camera=new THREE.OrthographicCamera(
 -window.innerWidth/2,
 window.innerWidth/2,
 window.innerHeight/2,
 -window.innerHeight/2,
 0.1,1000
);
camera.position.set(0,0,300);
camera.lookAt(0,0,0);

scene.add(new THREE.HemisphereLight(0xdfffe8,0x263a25,2.0));

const sun=new THREE.DirectionalLight(0xffedca,2.5);
sun.position.set(-80,120,150);
scene.add(sun);

const fill=new THREE.DirectionalLight(0x7edbff,1.2);
fill.position.set(90,50,100);
scene.add(fill);

/* POMOCNÉ FUNKCE PRO MODELOVÁNÍ */

function material(color,roughness=0.75,metalness=0){
 return new THREE.MeshStandardMaterial({
  color:color,roughness:roughness,metalness:metalness
 });
}

const green=material(0x145d3b);
const greenLight=material(0x278b55);
const darkGreen=material(0x093a29);
const leather=material(0x754525);
const leatherLight=material(0xb77a42);
const skin=material(0xe8b78b);
const skinDark=material(0x9d6547);
const cloth=material(0x4c3929);
const gold=material(0xd7ae53,0.35,0.5);
const steel=material(0x9bb8bd,0.3,0.7);
const eyeMat=material(0x25231d,0.3);
const white=material(0xffffff,0.2);

function mesh(geometry,mat,parent,x=0,y=0,z=0){
 const m=new THREE.Mesh(geometry,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function sphere(parent,mat,x,y,z,sx,sy,sz){
 const m=mesh(new THREE.SphereGeometry(1,24,18),mat,parent,x,y,z);
 m.scale.set(sx,sy,sz);
 return m;
}

function cylinder(parent,mat,x,y,z,rTop,rBottom,height){
 const m=mesh(new THREE.CylinderGeometry(rTop,rBottom,height,12),mat,parent,x,y,z);
 return m;
}

function limb(parent,mat,x,y,z,length,radius){
 const pivot=new THREE.Group();
 pivot.position.set(x,y,z);
 parent.add(pivot);
 const body=mesh(new THREE.CapsuleGeometry(radius,length,4,8),mat,pivot,0,-length/2,0);
 return pivot;
}

/* SKUTEČNÝ PROSTOROVÝ AVATAR */

const avatar=new THREE.Group();
scene.add(avatar);

/* Stín pod postavou */
const shadow=mesh(
 new THREE.CircleGeometry(19,32),
 new THREE.MeshBasicMaterial({color:0x07130b,transparent:true,opacity:0.42}),
 avatar,0,2,-2
);
shadow.scale.set(1.1,0.35,1);

/* Plášť */
const cape=mesh(
 new THREE.ConeGeometry(21,47,10,1,false),
 green,avatar,0,31,-1
);
cape.rotation.x=Math.PI;

/* Spodní okraj pláště */
const capeBottom=mesh(
 new THREE.CylinderGeometry(19,21,4,12),
 darkGreen,avatar,0,11,-1
);

/* Tělo */
const torso=mesh(
 new THREE.CapsuleGeometry(10,22,5,12),
 leather,avatar,0,39,5
);
torso.scale.set(1,1.05,0.75);

/* Tunika */
const tunic=mesh(
 new THREE.CylinderGeometry(8,13,23,12),
 greenLight,avatar,0,31,7
);

/* Pás */
mesh(new THREE.CylinderGeometry(10,10,3,12),gold,avatar,0,29,9);

/* Přezka */
mesh(new THREE.BoxGeometry(5,5,2),gold,avatar,0,29,11);

/* Batoh */
const backpack=mesh(
 new THREE.BoxGeometry(17,21,11),
 leather,avatar,-13,39,-4
);
backpack.rotation.z=-0.08;
mesh(new THREE.BoxGeometry(13,5,12),leatherLight,avatar,-13,29,-4);
mesh(new THREE.SphereGeometry(3,12,12),gold,avatar,-13,41,-11);

/* Ramena */
sphere(avatar,leatherLight,-11,48,5,7,7,7);
sphere(avatar,leatherLight,11,48,5,7,7,7);

/* Ruce – kloubové části */
const leftArm=limb(avatar,green, -15,45,5,19,4.5);
const rightArm=limb(avatar,green,15,45,5,19,4.5);

sphere(leftArm,skin,0,-21,0,4,4,4);
sphere(rightArm,skin,0,-21,0,4,4,4);

/* Rukavice */
sphere(leftArm,leatherLight,0,-22,0,4.5,3.5,4.5);
sphere(rightArm,leatherLight,0,-22,0,4.5,3.5,4.5);

/* Krk */
cylinder(avatar,skin,0,54,5,4,4,7);

/* Hlava */
sphere(avatar,skin,0,66,6,10,12,9);

/* Uši */
sphere(avatar,skinDark,-10,66,5,2.5,4,2);
sphere(avatar,skinDark,10,66,5,2.5,4,2);

/* Vlasy */
sphere(avatar,cloth,0,76,5,10.5,5,9);

/* Kapuce – prostorový prstenec a horní část */
const hood=mesh(
 new THREE.SphereGeometry(12,20,16,0,Math.PI*2,0,Math.PI*0.75),
 darkGreen,avatar,0,68,-1
);
hood.scale.set(1.05,1.05,0.85);

/* Obličej – oči a obočí */
sphere(avatar,eyeMat,-3.8,67,14,1.1,1.4,0.8);
sphere(avatar,eyeMat,3.8,67,14,1.1,1.4,0.8);
sphere(avatar,white,-4,67.5,14.6,0.35,0.4,0.25);
sphere(avatar,white,3.6,67.5,14.6,0.35,0.4,0.25);

/* Nos */
sphere(avatar,skinDark,0,64,15,1.5,2,1.5);

/* Znak na hrudi */
const emblem=mesh(
 new THREE.OctahedronGeometry(3),
 gold,avatar,0,41,14
);

/* Nohy – pohyblivé klouby */
const leftLeg=limb(avatar,cloth,-6,18,5,17,4.5);
const rightLeg=limb(avatar,cloth,6,18,5,17,4.5);

/* Boty */
const leftBoot=mesh(
 new THREE.BoxGeometry(10,6,14),
 leather,avatar,-6,4,10
);
const rightBoot=mesh(
 new THREE.BoxGeometry(10,6,14),
 leather,avatar,6,4,10
);

/* Přezky na botách */
mesh(new THREE.BoxGeometry(4,2,1),gold,avatar,-6,6,17);
mesh(new THREE.BoxGeometry(4,2,1),gold,avatar,6,6,17);

/* Meč na zádech */
const sword=new THREE.Group();
sword.position.set(16,37,-8);
sword.rotation.z=-0.3;
avatar.add(sword);
mesh(new THREE.BoxGeometry(4,36,2),steel,sword,0,14,0);
mesh(new THREE.ConeGeometry(3,8,4),steel,sword,0,36,0);
mesh(new THREE.BoxGeometry(13,3,4),gold,sword,0,-5,1);
mesh(new THREE.CylinderGeometry(2,2,10,8),leather,sword,0,-11,0);

/* ANIMACE */

const clock=new THREE.Clock();
let animationFrame=0;

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();

 if(moving){
  const walk=Math.sin(t*10);
  leftLeg.rotation.x=walk*0.48;
  rightLeg.rotation.x=-walk*0.48;
  leftArm.rotation.x=-walk*0.35;
  rightArm.rotation.x=walk*0.35;
  avatar.position.y=2+Math.abs(Math.sin(t*10))*2;
 }else{
  leftLeg.rotation.x*=0.88;
  rightLeg.rotation.x*=0.88;
  leftArm.rotation.x*=0.88;
  rightArm.rotation.x*=0.88;
  avatar.position.y=1.2+Math.sin(t*2)*0.8;
 }

 cape.rotation.z=Math.sin(t*2.2)*0.035;
 avatar.rotation.y=THREE.MathUtils.lerp(
  avatar.rotation.y,targetHeading,0.06
 );

 emblem.rotation.y=t*0.8;
 emblem.rotation.x=Math.sin(t)*0.2;

 if(playerPosition){
  const p=map.project(playerPosition);
  const w=window.innerWidth;
  const h=window.innerHeight;

  avatar.position.x=p.x-w/2;
  avatar.position.y=h/2-p.y;
  avatar.visible=p.x>-150&&p.x<w+150&&p.y>-150&&p.y<h+150;
 }

 renderer.render(scene,camera);
}
animate();

function resize(){
 const w=window.innerWidth;
 const h=window.innerHeight;
 renderer.setSize(w,h,false);
 camera.left=-w/2;
 camera.right=w/2;
 camera.top=h/2;
 camera.bottom=-h/2;
 camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

/* MAPA */

map.on('load',()=>{
 try{
  map.setFog({
   color:'#c5e4cf',
   'high-color':'#8ac9a0',
   'space-color':'#9bc8df',
   'horizon-blend':0.18,
   'star-intensity':0
  });
 }catch(e){}

 try{
  map.addSource('realm-dem',{
   type:'raster-dem',
   tiles:['https://demotiles.maplibre.org/terrain-tiles/{z}/{x}/{y}.png'],
   tileSize:256,
   encoding:'terrarium',
   maxzoom:12
  });
  map.setTerrain({source:'realm-dem',exaggeration:1.2});
 }catch(e){console.log('Terén není dostupný',e);}

 try{
  const layers=map.getStyle().layers;
  const firstSymbol=layers.find(l=>l.type==='symbol');
  map.addLayer({
   id:'realm-3d-buildings',
   source:'openmaptiles',
   'source-layer':'building',
   type:'fill-extrusion',
   minzoom:14,
   paint:{
    'fill-extrusion-color':[
     'interpolate',['linear'],['coalesce',['get','render_height'],8],
     0,'#a8b98c',
     15,'#c5aa7a',
     40,'#9a987a',
     80,'#e0c99b'
    ],
    'fill-extrusion-height':['coalesce',['get','render_height'],6],
    'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
    'fill-extrusion-opacity':0.92,
    'fill-extrusion-vertical-gradient':true
   }
  },firstSymbol?firstSymbol.id:undefined);
 }catch(e){console.log('3D budovy nejsou dostupné',e);}

 document.getElementById('locationStatus').textContent='SVĚT JE PŘIPRAVEN';
});

/* GPS A POHYB */

function say(text){
 document.getElementById('message').textContent=text;
}
function toast(text){
 const el=document.getElementById('toast');
 el.textContent=text;
 el.style.display='block';
 clearTimeout(el._timer);
 el._timer=setTimeout(()=>el.style.display='none',2500);
}

function distanceMeters(a,b){
 const R=6371000;
 const rad=v=>v*Math.PI/180;
 const dLat=rad(b[1]-a[1]);
 const dLon=rad(b[0]-a[0]);
 const x=Math.sin(dLat/2)**2+
 Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function bearingBetween(a,b){
 const rad=v=>v*Math.PI/180;
 const y=Math.sin(rad(b[0]-a[0]))*Math.cos(rad(b[1]));
 const x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-
 Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*
 Math.cos(rad(b[0]-a[0]));
 return Math.atan2(y,x);
}

function locatePlayer(){
 if(!navigator.geolocation){
  say('Tento prohlížeč nepodporuje GPS.');
  return;
 }
 say('Zjišťuji tvoji polohu…');

 navigator.geolocation.getCurrentPosition(
  p=>{
   const pos=[p.coords.longitude,p.coords.latitude];
   playerPosition=pos;
   lastPosition=pos;

   map.flyTo({center:pos,zoom:17,pitch:62,speed:1.1});

   document.getElementById('gpsStatus').textContent='GPS: AKTIVNÍ';
   document.getElementById('locationStatus').textContent='POLOHA NAČTENA';
   say('Tvůj 3D poutník vstoupil do světa REALM GO.');

   if(!objectsCreated){
    createWorldObjects();
    objectsCreated=true;
   }

   if(!gpsWatch){
    gpsWatch=navigator.geolocation.watchPosition(
     updateGPS,
     ()=>{},
     {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
    );
   }
  },
  error=>{
   document.getElementById('gpsStatus').textContent='GPS: NEDOSTUPNÁ';
   const errors={
    1:'Přístup k poloze nebyl povolen. Povol GPS v prohlížeči.',
    2:'Poloha není momentálně dostupná.',
    3:'Zjišťování polohy trvalo příliš dlouho.'
   };
   say(errors[error.code]||'Nepodařilo se zjistit polohu.');
  },
  {enableHighAccuracy:true,timeout:15000,maximumAge:0}
 );
}

function updateGPS(p){
 const next=[p.coords.longitude,p.coords.latitude];

 if(lastPosition){
  const distance=distanceMeters(lastPosition,next);

  if(distance>1.8){
   const heading=p.coords.heading;
   targetHeading=Number.isFinite(heading)&&heading>=0
    ? -heading*Math.PI/180
    : -bearingBetween(lastPosition,next);

   moving=true;
   lastMoveTime=Date.now();
   lastPosition=next;
  }
 }

 playerPosition=next;

 if(Date.now()-lastMoveTime>1800){
  moving=false;
 }

 if(objectsCreated===false){
  createWorldObjects();
  objectsCreated=true;
 }
}

function startGame(){
 document.getElementById('intro').style.display='none';
 gameStarted=true;
 locatePlayer();
}

/* PŘEDMĚTY NA MAPĚ – PEVNÉ GPS SOUŘADNICE */

const worldObjects=[
 {name:'Lesní krystal',type:'ENERGIE',kind:'crystal',dx:0.0011,dy:0.0005},
 {name:'Starobylá schránka',type:'POKLAD',kind:'wood',dx:-0.0012,dy:0.0008},
 {name:'Magický portál',type:'PORTÁL',kind:'portal',dx:0.0003,dy:-0.0014},
 {name:'Druhý krystal',type:'ENERGIE',kind:'crystal',dx:-0.0015,dy:-0.0011}
];

function createWorldObjects(){
 if(!playerPosition)return;
 clearObjects();

 worldObjects.forEach(item=>{
  const el=document.createElement('div');
  el.className='world-item';

  if(item.kind==='crystal'){
   el.classList.add('crystal');
   el.innerHTML='<div class="item-shadow"></div><div class="crystal-shape"></div><div class="crystal-shine"></div>';
  }
  if(item.kind==='wood'){
   el.classList.add('wood-item');
   el.innerHTML='<div class="item-shadow"></div><div class="wood-shape"></div>';
  }
  if(item.kind==='portal'){
   el.classList.add('portal-object');
   el.innerHTML='<div class="item-shadow"></div><div class="portal-ring"></div><div class="portal-base"></div>';
  }

  const coords=[
   playerPosition[0]+item.dx,
   playerPosition[1]+item.dy
  ];

  const marker=new maplibregl.Marker({
   element:el,
   anchor:'bottom',
   pitchAlignment:'map',
   rotationAlignment:'map'
  }).setLngLat(coords).addTo(map);

  el.addEventListener('click',()=>{
   say(item.name+' · '+item.type+' · Objekt objeven!');
   toast('OBJEVIL JSI: '+item.name.toUpperCase());
  });

  itemMarkers.push(marker);
 });
}

function clearObjects(){
 itemMarkers.forEach(m=>m.remove());
 itemMarkers=[];
 objectsCreated=false;
}
