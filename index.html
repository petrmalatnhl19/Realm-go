*{box-sizing:border-box}

 position:absolute;z-index:40;top:85px;left:50%;
 transform:translateX(-50%);
 padding:11px 17px;border-radius:13px;

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);

let map=null,renderer=null,scene=null,camera=null,avatar=null;
let parts={},playerPosition=null,lastPosition=null;
let heading=0,walking=false;
let xp=0,level=1;
let markers=[];
let worldItems=[];
let centered=false,followPlayer=true;
let worldItemsCreated=false;
let dayState=null;

function msg(text){
 const e=$("message");
 e.textContent=text;
 e.classList.add("show");
 setTimeout(()=>e.classList.remove("show"),2700);
}

function hideLoading(text){
 $("loadingText").textContent=text||"SYSTEM ONLINE";
 $("loading").classList.add("hidden");
 setTimeout(()=>$("loading").style.display="none",900);
}

function fail(text){
 $("debugText").textContent=text;
 $("debug").style.display="block";
 hideLoading("Částečný režim aktivní");
}

window.addEventListener("error",e=>{
 console.error(e);
 if(!map)fail(e.message||"Neznámá chyba");
});
window.addEventListener("unhandledrejection",e=>console.error(e.reason));

/* DEN A NOC */

function updateDayNight(){
 const hour=new Date().getHours()+new Date().getMinutes()/60;
 const isDay=hour>=6&&hour<19;
 if(dayState===isDay)return;
 dayState=isDay;

 document.body.classList.toggle("night",!isDay);

 if(map&&map.loaded()){
  try{
   map.setFog({
    color:isDay?"#c4e7d7":"#111a42",
    "high-color":isDay?"#8fd9d3":"#202b70",
    "space-color":isDay?"#d6eee0":"#080d2b",
    "horizon-blend":isDay?0.12:0.18,
    "star-intensity":isDay?0:0.65
   });
  }catch(e){}
 }
 $("worldMode").textContent=isDay?"ALIEN DAY":"ALIEN NIGHT";
 $("worldMode").style.color=isDay?"#8ffff1":"#c3aaff";
}

function updateClock(){
 const now=new Date();
 $("clock").textContent=now.toLocaleTimeString("cs-CZ",{
  hour:"2-digit",minute:"2-digit"
 });
 updateDayNight();
}

/* MAPA */

function startMap(){
 if(typeof maplibregl==="undefined"){
  fail("MapLibre se nepodařilo načíst. Zkontroluj internet.");
  return;
 }

 try{
  map=new maplibregl.Map({
   container:"map",
   style:"https://tiles.openfreemap.org/styles/liberty",
   center:[15,49],
   zoom:14,
   pitch:55,
   bearing:0,
   maxPitch:60,
   minZoom:3,
   maxZoom:21,
   antialias:true,
   attributionControl:false,
   dragRotate:false,
   touchPitch:false
  });

  map.addControl(new maplibregl.AttributionControl({compact:true}));

  map.touchZoomRotate.disableRotation();
  map.dragRotate.disable();
  map.keyboard.disableRotation();

  map.on("dragstart",()=>{
   followPlayer=false;
  });

  map.on("load",()=>{
   customizeMap();
   updateDayNight();
   hideLoading("ALIEN WORLD ONLINE");
  });

  map.on("error",e=>console.warn("Map:",e.error||e));

 }catch(e){
  fail("Map engine: "+e.message);
 }
}

/* FUTURISTICKÉ BARVY MAPY */

function customizeMap(){
 if(!map)return;

 const layers=map.getStyle().layers||[];

 layers.forEach(layer=>{
  const id=layer.id.toLowerCase();
  const type=layer.type;

  try{
   if(type==="background"){
    map.setPaintProperty(layer.id,"background-color","#182b38");
   }

   if(type==="fill"){
    if(/water|ocean|river|lake/.test(id)){
     map.setPaintProperty(layer.id,"fill-color","#16a9b9");
     map.setPaintProperty(layer.id,"fill-opacity",0.9);
    }
    else if(/park|grass|wood|forest|landcover|landuse|vegetation/.test(id)){
     map.setPaintProperty(layer.id,"fill-color",
      ["case",
       ["any",["in","wood",["coalesce",["get","class"],""]],
        ["in","forest",["coalesce",["get","class"],""]]],
       "#276f5b","#367f68"
      ]);
     map.setPaintProperty(layer.id,"fill-opacity",0.9);
    }
    else if(/building/.test(id)){
     map.setPaintProperty(layer.id,"fill-color","#537d91");
     map.setPaintProperty(layer.id,"fill-opacity",0.85);
    }
    else if(/land|earth|background/.test(id)){
     map.setPaintProperty(layer.id,"fill-color","#526e66");
    }
   }

   if(type==="line"){
    if(/water/.test(id)){
     map.setPaintProperty(layer.id,"line-color","#27dce9");
     map.setPaintProperty(layer.id,"line-opacity",0.9);
    }
    else if(/road|street|transportation/.test(id)){
     map.setPaintProperty(layer.id,"line-color",
      ["match",["get","class"],
       "motorway","#b1dce1",
       "primary","#a2d7d2",
       "secondary","#9bcfc8",
       "tertiary","#8dbdb8",
       "#a1c8c0"
      ]);
     map.setPaintProperty(layer.id,"line-opacity",0.95);
    }
   }

   if(type==="symbol"){
    try{
     map.setPaintProperty(layer.id,"text-color","#e4ffff");
     map.setPaintProperty(layer.id,"text-halo-color","#18364b");
     map.setPaintProperty(layer.id,"text-halo-width",1.5);
    }catch(e){}
   }
  }catch(e){
   console.log("Vrstva přeskočena:",layer.id,e.message);
  }
 });

 // 3D budovy – použijeme skutečný zdroj budov ze stylu.
 const building=layers.find(l=>
  l.type==="fill"&&l.id.toLowerCase().includes("building")&&
  l["source-layer"]&&l.source
 );

 if(building){
  try{
   map.addLayer({
    id:"realm-alien-buildings-3d",
    type:"fill-extrusion",
    source:building.source,
    "source-layer":building["source-layer"],
    minzoom:15,
    paint:{
     "fill-extrusion-color":"#527e91",
     "fill-extrusion-height":[
      "coalesce",["get","render_height"],["get","height"],8
     ],
     "fill-extrusion-base":[
      "coalesce",["get","render_min_height"],0
     ],
     "fill-extrusion-opacity":0.78,
     "fill-extrusion-vertical-gradient":true
    }
   },layers.find(l=>l.type==="symbol")?.id);
  }catch(e){
   console.log("3D budovy nejsou dostupné:",e);
  }
 }
}

/* HERNÍ OBJEKTY – PEVNÉ GPS POZICE */

function offsetMeters(lng,lat,east,north){
 const lat2=lat+north/111320;
 const lng2=lng+east/(111320*Math.cos(lat*Math.PI/180));
 return [lng2,lat2];
}

function distanceMeters(a,b){
 const R=6371000;
 const rad=x=>x*Math.PI/180;

 const dLat=rad(b[1]-a[1]);
 const dLng=rad(b[0]-a[0]);

 const h=
  Math.sin(dLat/2)**2+
  Math.cos(rad(a[1]))*
  Math.cos(rad(b[1]))*
  Math.sin(dLng/2)**2;

 return 2*R*Math.asin(Math.sqrt(h));
}

function addItem(position,emoji,name){
 const el=document.createElement("div");
 el.className="item-marker";
 el.innerHTML=
  '<span class="item-symbol">'+emoji+'</span>'+
  '<span class="item-shadow"></span>'+
  '<span class="item-ring"></span>';

 const marker=new maplibregl.Marker({
  element:el,
  anchor:"bottom"
 }).setLngLat(position).addTo(map);

 const item={
  marker,
  position,
  name,
  collected:false
 };

 worldItems.push(item);
 markers.push(marker);
// Přizpůsobení velikosti předmětu zoomu mapy
function updateItemScale(){
 const scale=Math.max(
  0.35,
  Math.min(2.5,Math.pow(2,map.getZoom()-18))
 );

 markers.forEach(m=>{
  const el=m.getElement();
  el.style.transform=`scale(${scale})`;
 });
}

map.on("zoom",updateItemScale);
updateItemScale();
 el.addEventListener("click",()=>{
  if(!playerPosition){
   msg("Nejdříve potřebuješ GPS signál.");
   return;
  }

  const distance=distanceMeters(playerPosition,position);

  if(distance>15){
   msg("PŘÍLIŠ DALEKO · "+Math.round(distance)+" m");
   return;
  }

  collectItem(item);
 });
}

function collectItem(item){
 if(item.collected)return;

 item.collected=true;
 item.marker.remove();

 msg("✦ ARTEFAKT ZÍSKÁN: "+item.name);
 addXP(10);

 saveCollectedItems();
}

function saveCollectedItems(){
 try{
  const collected=worldItems
   .filter(item=>item.collected)
   .map(item=>item.name);

  localStorage.setItem(
   "realmGoCollectedV1",
   JSON.stringify(collected)
  );
 }catch(e){
  console.warn("Uložení inventáře:",e);
 }
}

function createWorldItems(){
 if(worldItemsCreated||!playerPosition||!map)return;

 worldItemsCreated=true;

 const storageKey="realmGoWorldV1";
 const collectedKey="realmGoCollectedV1";

 const objects=[
  [28,15,"💎","Energetický krystal"],
  [-35,22,"🪷","Mimozemská rostlina"],
  [22,-38,"🔮","Plazmové jádro"],
  [-32,-30,"✨","Kosmická esence"],
  [52,-8,"📦","Technologická schránka"],
  [-65,5,"🌀","Energetický portál"]
 ];

 let savedWorld=null;
 let collected=[];

 try{
  savedWorld=JSON.parse(localStorage.getItem(storageKey));
  collected=JSON.parse(localStorage.getItem(collectedKey))||[];
 }catch(e){}

 if(!Array.isArray(savedWorld)||savedWorld.length!==objects.length){
  const [lng,lat]=playerPosition;

  savedWorld=objects.map(o=>({
   position:offsetMeters(lng,lat,o[0],o[1]),
   emoji:o[2],
   name:o[3]
  }));

  try{
   localStorage.setItem(storageKey,JSON.stringify(savedWorld));
  }catch(e){}
 }

 savedWorld.forEach(item=>{
  if(collected.includes(item.name))return;

  addItem(item.position,item.emoji,item.name);
 });
}

/* XP */

function addXP(n){
 xp+=n;
 while(xp>=level*100){
  xp-=level*100;
  level++;
  msg("LEVEL UP · "+level);
 }
 $("level").textContent=
  "LEVEL "+String(level).padStart(2,"0")+" · "+xp+" XP";
}

/* 3D AVATAR */

function createAvatar(){
 if(typeof THREE==="undefined"){
  console.warn("Three.js není dostupné");
  return;
 }

 try{
  renderer=new THREE.WebGLRenderer({
   canvas:$("avatarCanvas"),alpha:true,antialias:true
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight);

  scene=new THREE.Scene();

  camera=new THREE.OrthographicCamera(
   -innerWidth/2,innerWidth/2,
   innerHeight/2,-innerHeight/2,
   .1,1000
  );
  camera.position.set(0,0,150);
  camera.lookAt(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff,1.7));

  const light=new THREE.DirectionalLight(0x9afff2,2.2);
  light.position.set(-40,80,100);
  scene.add(light);

  const neon=new THREE.PointLight(0x24eaff,1.5,200);
  neon.position.set(0,30,40);
  scene.add(neon);

  avatar=new THREE.Group();
  scene.add(avatar);

  const material=(color,metalness=0,roughness=.5,emissive=0x000000)=>
   new THREE.MeshStandardMaterial({
    color,metalness,roughness,emissive,emissiveIntensity:.5
   });

  const armor=material(0x245a69,.75,.3,0x092b39);
  const armorDark=material(0x142e49,.7,.3,0x071d38);
  const skin=material(0xc4d9df,.15,.55,0x162e40);
  const metal=material(0x72dfe6,.85,.25,0x1c8293);
  const gold=material(0xe8cc72,.75,.3,0x62420a);
  const boots=material(0x17263b,.6,.4);

  function part(g,m,parent,x,y,z){
   const o=new THREE.Mesh(g,m);
   o.position.set(x,y,z);
   parent.add(o);
   return o;
  }

  // Světelný kruh pod postavou
  const ring=part(
   new THREE.TorusGeometry(19,1.1,8,48),
   metal,avatar,0,2,-8
  );
  ring.rotation.x=0;

  const shadow=part(
   new THREE.CircleGeometry(17,32),
   new THREE.MeshBasicMaterial({color:0x102a48,transparent:true,opacity:.5}),
   avatar,0,1,-9
  );
  shadow.scale.set(1.5,.4,1);

  // Energetický batoh
  const backpack=part(
   new THREE.BoxGeometry(17,23,10),
   armorDark,avatar,0,55,-9
  );

  // Dva svítící moduly batohu
  part(new THREE.BoxGeometry(4,17,3),metal,avatar,-7,55,-15);
  part(new THREE.BoxGeometry(4,17,3),metal,avatar,7,55,-15);

  // Tělo
  part(
   new THREE.CapsuleGeometry(10,20,5,12),
   armor,avatar,0,49,3
  );

  // Hrudní energetické jádro
  const core=part(
   new THREE.OctahedronGeometry(5),
   material(0x7efff3,.5,.2,0x18d9e7),
   avatar,0,53,14
  );

  // Hlava
  part(
   new THREE.SphereGeometry(10,24,20),
   skin,avatar,0,78,5
  );

  // Futuristická přilba
  const helmet=part(
   new THREE.SphereGeometry(12,24,18),
   armorDark,avatar,0,82,1
  );

  // Svítící hledí
  part(
   new THREE.BoxGeometry(14,3,2),
   metal,avatar,0,78,13
  );

  // Antény
  part(new THREE.CylinderGeometry(1,1,10,8),metal,avatar,-8,92,0);
  part(new THREE.SphereGeometry(2,8,8),gold,avatar,-8,98,0);

  // Ramena
  part(new THREE.SphereGeometry(7,16,16),armor,avatar,-13,57,3);
  part(new THREE.SphereGeometry(7,16,16),armor,avatar,13,57,3);

  // Paže
  const leftArm=new THREE.Group();
  leftArm.position.set(-14,54,4);
  avatar.add(leftArm);
  part(new THREE.CapsuleGeometry(4,15,4,8),armor,leftArm,0,-10,0);
  part(new THREE.SphereGeometry(4,12,12),metal,leftArm,0,-19,0);

  const rightArm=new THREE.Group();
  rightArm.position.set(14,54,4);
  avatar.add(rightArm);
  part(new THREE.CapsuleGeometry(4,15,4,8),armor,rightArm,0,-10,0);
  part(new THREE.SphereGeometry(4,12,12),metal,rightArm,0,-19,0);

  // Nohy
  const leftLeg=new THREE.Group();
  leftLeg.position.set(-6,31,4);
  avatar.add(leftLeg);
  part(new THREE.CapsuleGeometry(4,13,4,8),armorDark,leftLeg,0,-9,0);
  part(new THREE.BoxGeometry(10,7,15),boots,leftLeg,0,-20,4);
  part(new THREE.BoxGeometry(7,2,2),metal,leftLeg,0,-19,12);

  const rightLeg=new THREE.Group();
  rightLeg.position.set(6,31,4);
  avatar.add(rightLeg);
  part(new THREE.CapsuleGeometry(4,13,4,8),armorDark,rightLeg,0,-9,0);
  part(new THREE.BoxGeometry(10,7,15),boots,rightLeg,0,-20,4);
  part(new THREE.BoxGeometry(7,2,2),metal,rightLeg,0,-19,12);

  parts={leftArm,rightArm,leftLeg,rightLeg,ring,core};
 }catch(e){
  console.error("Avatar:",e);
  avatar=null;
 }
}

/* GPS */

function startGPS(){
 if(!navigator.geolocation){
  $("locationStatus").textContent="GPS není podporována";
  return;
 }

 $("locationStatus").textContent="Vyhledávám signál GPS...";

 navigator.geolocation.watchPosition(onPosition,gpsError,{
  enableHighAccuracy:true,maximumAge:3000,timeout:20000
 });
}

function onPosition(pos){
 const lng=pos.coords.longitude;
 const lat=pos.coords.latitude;
 if(!Number.isFinite(lng)||!Number.isFinite(lat))return;

 playerPosition=[lng,lat];

 if(lastPosition){
  const dx=(lng-lastPosition[0])*111320*Math.cos(lat*Math.PI/180);
  const dy=(lat-lastPosition[1])*111320;
  const distance=Math.hypot(dx,dy);

  if(distance>1.5){
   heading=Math.atan2(dx,dy);
   walking=true;
  }else{
   walking=false;
  }
 }

 lastPosition=[lng,lat];

 $("locationStatus").textContent=
  "GPS ONLINE · "+Math.round(pos.coords.accuracy)+" m";

 $("coords").textContent=
  lat.toFixed(5)+" N  ·  "+lng.toFixed(5)+" E";

 if(map&&map.loaded()){
  if(!centered){
   centered=true;
   map.flyTo({
    center:playerPosition,zoom:18,pitch:55,bearing:0,duration:1800
   });
   setTimeout(createWorldItems,2200);
  }else if(followPlayer){
   const c=map.getCenter();
   const dx=(lng-c.lng)*111320*Math.cos(lat*Math.PI/180);
   const dy=(lat-c.lat)*111320;
   if(Math.hypot(dx,dy)>8){
    map.easeTo({center:playerPosition,duration:700});
   }
  }
 }
}

function gpsError(e){
 const errors={
  1:"Povol přístup k poloze.",
  2:"GPS signál není dostupný.",
  3:"GPS odpověděla příliš pozdě."
 };
 $("locationStatus").textContent=errors[e.code]||"GPS ERROR";
}

/* AVATAR – BEZ NAKLÁPĚNÍ */

function updateAvatar(){
 if(!avatar||!playerPosition||!map||!map.loaded())return;

 const p=map.project(playerPosition);

 avatar.position.set(
  p.x-innerWidth/2,
  innerHeight/2-p.y,
  0
 );

 // Celá postava zůstává vzpřímená.
 // Otáčí se výhradně kolem svislé osy Y.
 avatar.rotation.set(0,heading,0);
 // Velikost avatara se přizpůsobuje zoomu mapy
const zoomScale=Math.pow(2,map.getZoom()-18);
const avatarScale=Math.max(0.35,Math.min(2.5,zoomScale));

avatar.scale.setScalar(avatarScale);

 const t=performance.now()*.008;

 if(walking){
  parts.leftLeg.rotation.x=Math.sin(t)*.4;
  parts.rightLeg.rotation.x=-Math.sin(t)*.4;
  parts.leftArm.rotation.x=-Math.sin(t)*.3;
  parts.rightArm.rotation.x=Math.sin(t)*.3;
  avatar.position.y+=Math.abs(Math.sin(t*2))*1.4;
 }else{
  parts.leftLeg.rotation.x=0;
  parts.rightLeg.rotation.x=0;
  parts.leftArm.rotation.x=0;
  parts.rightArm.rotation.x=0;
  avatar.position.y+=Math.sin(t*.4)*.7;
 }

 parts.ring.rotation.z=t*.3;
 parts.core.rotation.y=t*.8;
 parts.core.rotation.x=t*.5;
}

function animate(){
 requestAnimationFrame(animate);
 if(renderer&&scene&&camera){
  updateAvatar();
  renderer.render(scene,camera);
 }
}

/* OVLÁDÁNÍ */

$("gpsButton").onclick=()=>{
 if(playerPosition&&map){
  followPlayer=true;
  map.flyTo({
   center:playerPosition,zoom:18,pitch:55,bearing:0,duration:1200
  });
 }else startGPS();
};

$("zoomIn").onclick=()=>map&&map.zoomIn();
$("zoomOut").onclick
=()=>map&&map.zoomOut();

$("inventoryButton").onclick=()=>{
 msg("INVENTÁŘ · Zatím nemáš žádné artefakty.");
};

$("worldButton").onclick=()=>{
 if(!map)return;
 const pitch=map.getPitch()>30?0:55;
 map.easeTo({pitch,duration:900});
 msg(pitch===55?"3D POHLED AKTIVNÍ":"POHLED SHORA");
};

window.addEventListener("resize",()=>{
 if(renderer){
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
 }
 if(camera){
  camera.left=-innerWidth/2;
  camera.right=innerWidth/2;
  camera.top=innerHeight/2;
  camera.bottom=-innerHeight/2;
  camera.updateProjectionMatrix();
 }
 if(map)map.resize();
});

function boot(){
 updateClock();
 setInterval(updateClock,30000);

 try{
  createAvatar();
  animate();
 }catch(e){
  console.error("3D inicializace:",e);
 }

 startMap();
 startGPS();

 setTimeout(()=>{
  if(!$("loading").classList.contains("hidden")){
   if(map&&map.loaded()){
    hideLoading("ALIEN WORLD ONLINE");
   }else{
    fail("Mapa se nenačetla. Zkontroluj internetové připojení a dostupnost mapových dlaždic.");
   }
  }
 },22000);
}

boot();

})();
</script>
</body>
