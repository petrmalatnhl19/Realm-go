
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07121e">
<title>REALM GO — Living World</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
:root {
 --cyan:#65edff;
 --purple:#bd7aff;
 --gold:#ffd17d;
 --panel:rgba(5,15,29,.91);
}

* {box-sizing:border-box;margin:0;padding:0}

body {
 background:#06121f;
 color:white;
 font-family:system-ui,Arial,sans-serif;
 overflow:hidden;
}

#map {
 position:absolute;
 inset:0;
}

.topbar {
 position:absolute;
 z-index:10;
 top:env(safe-area-inset-top,10px);
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 pointer-events:none;
}

.logo,.hud,.panel,.card {
 background:var(--panel);
 backdrop-filter:blur(15px);
 border:1px solid #5eeaff66;
 box-shadow:0 0 24px #00cfff18;
 border-radius:16px;
}

.logo {
 padding:10px 14px;
}

.logo strong {
 color:var(--cyan);
 letter-spacing:3px;
 font-size:17px;
}

.logo small {
 display:block;
 color:#aacbd9;
 font-size:8px;
 letter-spacing:2px;
 margin-top:3px;
}

.hud {
 padding:9px 12px;
 font-size:10px;
 text-align:right;
}

.hud b {color:#76ffb4}

.controls {
 position:absolute;
 z-index:10;
 top:100px;
 right:12px;
 display:flex;
 flex-direction:column;
 gap:8px;
}

button {
 cursor:pointer;
 border:1px solid #65edff77;
 color:white;
 background:rgba(5,23,39,.95);
 border-radius:13px;
 padding:11px;
 font-weight:800;
}

.controls button {
 width:46px;
 height:46px;
 font-size:17px;
}

button:active {
 transform:scale(.95);
}

.bottom {
 position:absolute;
 z-index:10;
 bottom:calc(12px + env(safe-area-inset-bottom));
 left:12px;
 right:12px;
 display:flex;
 gap:8px;
 align-items:stretch;
}

.panel {
 flex:1;
 min-width:0;
 padding:12px;
}

.panel strong {
 color:var(--cyan);
 font-size:12px;
}

.panel small {
 display:block;
 margin-top:5px;
 font-size:10px;
 color:#b4c9d5;
}

.primary {
 background:linear-gradient(135deg,#91faff,#28a9d7);
 color:#071622;
 border:0;
 min-width:100px;
}

.player {
 width:46px;
 height:46px;
 display:grid;
 place-items:center;
 border-radius:50%;
 background:radial-gradient(circle,#fff 0%,#73faff 20%,#168bc0 50%,#061a36 75%);
 border:2px solid white;
 box-shadow:0 0 15px #00edff,0 0 35px #00cfff;
 font-size:23px;
 position:relative;
}

.player:after {
 content:"";
 position:absolute;
 inset:-9px;
 border:1px solid #60edff;
 border-radius:50%;
 animation:pulse 2s infinite;
}

@keyframes pulse {
 0% {transform:scale(.7);opacity:.9}
 100% {transform:scale(1.7);opacity:0}
}

/* PORTÁLY */

.portal-marker {
 width:45px;
 height:52px;
 display:grid;
 place-items:center;
 font-size:33px;
 filter:drop-shadow(0 0 10px #b76aff);
 animation:portalFloat 2s ease-in-out infinite;
 cursor:pointer;
}

.portal-marker span {
 display:block;
 animation:portalRotate 8s linear infinite;
}

@keyframes portalFloat {
 50% {transform:translateY(-6px)}
}

@keyframes portalRotate {
 to {transform:rotate(360deg)}
}

/* TVOROVÉ */

.creature-marker {
 width:48px;
 height:48px;
 display:grid;
 place-items:center;
 font-size:31px;
 border-radius:50%;
 border:1px solid #8fffff;
 background:radial-gradient(circle,#18465d,#081829);
 box-shadow:0 0 15px #4eeeff88;
 cursor:pointer;
 animation:creatureFloat 2.5s ease-in-out infinite;
}

@keyframes creatureFloat {
 50% {transform:translateY(-5px) scale(1.04)}
}

/* DETAIL OBJEKTU */

.overlay {
 position:absolute;
 z-index:30;
 inset:0;
 background:#0009;
 display:none;
 align-items:center;
 justify-content:center;
 padding:22px;
}

.card {
 width:100%;
 max-width:350px;
 padding:22px;
 text-align:center;
 border-color:#9c70ff;
 box-shadow:0 0 45px #a54fff44;
}

.card .symbol {
 font-size:65px;
 margin:15px 0;
 filter:drop-shadow(0 0 15px #a64dff);
}

.card h2 {
 color:#bfa0ff;
 font-size:21px;
}

.card p {
 color:#c1d5e3;
 font-size:12px;
 line-height:1.6;
 margin:12px 0;
}

.card .distance {
 color:var(--gold);
 font-weight:bold;
 margin:12px;
}

.card button {
 width:100%;
 margin-top:8px;
}

.close {
 background:transparent;
}

#toast {
 position:absolute;
 z-index:40;
 top:85px;
 left:50%;
 transform:translateX(-50%);
 display:none;
 padding:11px 15px;
 background:#071b30;
 border:1px solid var(--cyan);
 border-radius:12px;
 font-size:11px;
 text-align:center;
 max-width:90%;
}

.radar {
 position:absolute;
 z-index:9;
 left:12px;
 top:100px;
 width:80px;
 height:80px;
 border:1px solid #62edff88;
 border-radius:50%;
 background:radial-gradient(circle,#143d4d88,#061522bb);
 box-shadow:0 0 18px #00dfff22;
 overflow:hidden;
}

.radar:before {
 content:"";
 position:absolute;
 width:50%;
 height:50%;
 left:50%;
 top:50%;
 transform-origin:top left;
 background:linear-gradient(135deg,#65edff55,transparent);
 animation:scan 3s linear infinite;
}

@keyframes scan {
 to {transform:rotate(360deg)}
}

.radar-label {
 position:absolute;
 bottom:5px;
 width:100%;
 text-align:center;
 font-size:8px;
 color:#a6eaff;
}

.radar-dot {
 position:absolute;
 width:5px;
 height:5px;
 border-radius:50%;
 background:#ffe18a;
 box-shadow:0 0 7px #ffe18a;
}

@media(min-width:700px) {
 .bottom {max-width:510px;left:20px}
 .controls {right:20px}
 .radar {left:20px}
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">
 <div class="logo">
  <strong>REALM GO</strong>
  <small>LIVING FANTASY WORLD</small>
 </div>

 <div class="hud">
  <b id="gpsStatus">● GPS OFFLINE</b>
  <div id="worldStatus">WORLD INITIALIZING</div>
 </div>
</div>

<div class="radar" id="radar">
 <div class="radar-label">WORLD RADAR</div>
</div>

<div class="controls">
 <button id="btn3d">3D</button>
 <button id="btnNorth">N</button>
 <button id="btnZoomIn">＋</button>
 <button id="btnZoomOut">－</button>
 <button id="btnRefresh">⟳</button>
</div>

<div class="bottom">
 <div class="panel">
  <strong id="playerName">EXPLORER LEVEL 1</strong>
  <small id="coordinates">Čekám na GPS...</small>
  <small id="nearby">Herní okolí se připravuje</small>
 </div>

 <button class="primary" id="btnLocate">◎ POLOHA</button>
</div>

<div class="overlay" id="overlay">
 <div class="card">
  <div id="objectSymbol" class="symbol">✨</div>
  <h2 id="objectName">Tajemný objekt</h2>
  <p id="objectDescription"></p>
  <div id="objectDistance" class="distance"></div>
  <button id="interact">PROZKOUMAT</button>
  <button class="close" id="closeCard">ZAVŘÍT</button>
 </div>
</div>

<div id="toast"></div>

<script>

// ==========================================
// 1. MAPA
// ==========================================

const map = new maplibregl.Map({
 container:'map',

 center:[14.65,49.42],

 zoom:15.5,

 pitch:55,

 bearing:0,

 antialias:true,

 style:{

  version:8,

  sources:{

   osm:{
    type:'raster',
    tiles:[
     'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
    ],
    tileSize:256,
    attribution:'© OpenStreetMap contributors'
   },

   terrainSource:{
    type:'raster-dem',
    tiles:[
     'https://demotiles.maplibre.org/terrain-tiles/{z}/{x}/{y}.png'
    ],
    tileSize:256,
    maxzoom:12,
    encoding:'terrarium'
   }

  },

  layers:[

   {
    id:'osm',
    type:'raster',
    source:'osm',
    paint:{
     'raster-saturation':-0.25,
     'raster-contrast':0.12,
     'raster-brightness-max':0.92
    }
   }

  ]

 }

});

let terrainEnabled=false;

map.on('load',()=>{

 try {

  map.setTerrain({
   source:'terrainSource',
   exaggeration:1.35
  });

  terrainEnabled=true;

  map.addLayer({
   id:'terrain-shading',
   type:'hillshade',
   source:'terrainSource',
   paint:{
    'hillshade-exaggeration':0.35
   }
  });

 } catch(e) {

  console.warn('Terrain unavailable',e);

 }

 $('worldStatus').textContent='WORLD ONLINE';

 showToast('REALM GO: Svět byl probuzen.');

});


// ==========================================
// 2. STAV HRY
// ==========================================

const $=id=>document.getElementById(id);

let player=null;
let playerMarker=null;
let watchID=null;
let following=true;
let is3D=true;

let objects=[];
let selectedObject=null;

const creatureTypes=[
 {
  name:'Ignis',
  symbol:'🔥',
  description:'Ohnivý tvor, který se objevuje v teplých oblastech světa.',
  type:'Ohnivý'
 },
 {
  name:'Aquaris',
  symbol:'💧',
  description:'Vodní duch, který hledá čisté prameny a rybníky.',
  type:'Vodní'
 },
 {
  name:'Sylvan',
  symbol:'🌿',
  description:'Lesní strážce ukrytý v zelených částech krajiny.',
  type:'Přírodní'
 },
 {
  name:'Noctis',
  symbol:'🌙',
  description:'Tajemný tvor, který se pohybuje ve stínu.',
  type:'Temný'
 },
 {
  name:'Voltar',
  symbol:'⚡',
  description:'Energický tvor plný elektrické energie.',
  type:'Elektrický'
 },
 {
  name:'Aeris',
  symbol:'🪽',
  description:'Vzdušný tvor, který miluje otevřenou krajinu.',
  type:'Vzdušný'
 }
];

const portalTypes=[
 {
  name:'Portál pradávné energie',
  symbol:'🌀',
  description:'Starobylá brána plná neznámé energie.'
 },
 {
  name:'Krystalický portál',
  symbol:'💎',
  description:'Magické místo, kde se soustřeďuje energie krystalů.'
 },
 {
  name:'Brána stínů',
  symbol:'🌌',
  description:'Tajemný průchod do neprozkoumaných částí světa.'
 }
];


// ==========================================
// 3. POMOCNÉ FUNKCE
// ==========================================

function showToast(message){

 const el=$('toast');

 el.textContent=message;

 el.style.display='block';

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  el.style.display='none';
 },3500);

}


function random(min,max){

 return min+Math.random()*(max-min);

}


function randomPoint(lat,lon,minDistance,maxDistance){

 const angle=Math.random()*Math.PI*2;

 const distance=random(minDistance,maxDistance);

 const north=distance*Math.cos(angle);

 const east=distance*Math.sin(angle);

 const newLat=lat+north/111320;

 const newLon=lon+east/(111320*Math.cos(lat*Math.PI/180));

 return [newLon,newLat];

}


function distanceBetween(a,b){

 const R=6371000;

 const rad=x=>x*Math.PI/180;

 const dLat=rad(b[1]-a[1]);

 const dLon=rad(b[0]-a[0]);

 const x=Math.sin(dLat/2)**2+
 Math.cos(rad(a[1]))*
 Math.cos(rad(b[1]))*
 Math.sin(dLon/2)**2;

 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

}


// ==========================================
// 4. AVATAR HRÁČE
// ==========================================

function createPlayer(){

 const el=document.createElement('div');

 el.className='player';

 el.textContent='✦';

 return el;

}


function updatePlayer(position){

 const lat=position.coords.latitude;

 const lon=position.coords.longitude;

 player=[lon,lat];

 $('gpsStatus').textContent='● GPS ONLINE';

 $('gpsStatus').style.color='#75ffb3';

 $('coordinates').textContent=
 lat.toFixed(5)+' / '+lon.toFixed(5)+
 ' • ±'+Math.round(position.coords.accuracy)+' m';

 if(!playerMarker){

  playerMarker=new maplibregl.Marker({
   element:createPlayer(),
   anchor:'center'
  })
  .setLngLat(player)
  .addTo(map);

 }else{

  playerMarker.setLngLat(player);

 }

 if(following){

  map.easeTo({
   center:player,
   duration:600
  });

 }

 // Nové herní okolí při vzdálenějším pohybu.

 if(!window.lastWorldPosition ||
 distanceBetween(player,window.lastWorldPosition)>250){

  generateWorld();

 }

 updateRadar();

}


function gpsError(error){

 $('gpsStatus').textContent='● GPS ERROR';

 if(error.code===1){
  showToast('Povol přístup k poloze.');
 }else if(error.code===2){
  showToast('GPS poloha není dostupná.');
 }else{
  showToast('Čekání na GPS vypršelo.');
 }

}


function startGPS(){

 if(!navigator.geolocation){

  showToast('GPS není podporováno.');

  return;

 }

 $('gpsStatus').textContent='● GPS LOADING';

 navigator.geolocation.getCurrentPosition(

  updatePlayer,

  gpsError,

  {
   enableHighAccuracy:true,
   maximumAge:2000,
   timeout:20000
  }

 );

 if(watchID===null){

  watchID=navigator.geolocation.watchPosition(

   updatePlayer,

   gpsError,

   {
    enableHighAccuracy:true,
    maximumAge:2000,
    timeout:20000
   }

  );

 }

}


// ==========================================
// 5. GENEROVÁNÍ HERNÍHO SVĚTA
// ==========================================

function generateWorld(){

 if(!player)return;

 window.lastWorldPosition=[...player];

 // Odstranění starých objektů.

 objects.forEach(obj=>{
  if(obj.marker)obj.marker.remove();
 });

 objects=[];

 // Tvorové.

 for(let i=0;i<12;i++){

  const creature=
   creatureTypes[Math.floor(Math.random()*creatureTypes.length)];

  const coords=randomPoint(
   player[1],
   player[0],
   100,
   900
  );

  addWorldObject({
   id:'creature-'+i,
   kind:'creature',
   name:creature.name,
   symbol:creature.symbol,
   description:creature.description,
   type:creature.type,
   coords:coords
  });

 }

 // Magické portály.

 for(let i=0;i<4;i++){

  const portal=
   portalTypes[Math.floor(Math.random()*portalTypes.length)];

  const coords=randomPoint(
   player[1],
   player[0],
   250,
   1200
  );

  addWorldObject({
   id:'portal-'+i,
   kind:'portal',
   name:portal.name,
   symbol:portal.symbol,
   description:portal.description,
   type:'Magické místo',
   coords:coords
  });

 }

 updateNearby();

 updateRadar();

 $('worldStatus').textContent='WORLD GENERATED';

 showToast('V okolí se objevily nové herní objekty.');

}


function addWorldObject(data){

 const el=document.createElement('div');

 if(data.kind==='portal'){

  el.className='portal-marker';

  el.innerHTML='<span>'+data.symbol+'</span>';

 }else{

  el.className='creature-marker';

  el.textContent=data.symbol;

 }

 const marker=new maplibregl.Marker({
  element:el,
  anchor:'bottom'
 })
 .setLngLat(data.coords)
 .addTo(map);

 data.marker=marker;

 data.discovered=false;

 objects.push(data);

 el.addEventListener('click',()=>{

  openObject(data);

 });

}


// ==========================================
// 6. INTERAKCE S OBJEKTY
// ==========================================

function openObject(obj){

 selectedObject=obj;

 $('objectSymbol').textContent=obj.symbol;

 $('objectName').textContent=obj.name;

 $('objectDescription').textContent=
 obj.description+
 ' Typ: '+obj.type+'.';

 const dist=player?
 distanceBetween(player,obj.coords):0;

 $('objectDistance').textContent=
 Math.round(dist)+' metrů od tebe';

 $('interact').textContent=
 obj.discovered?'JIŽ PROZKOUMÁNO':'PROZKOUMAT';

 $('overlay').style.display='flex';

}


$('closeCard').onclick=()=>{

 $('overlay').style.display='none';

};


$('overlay').addEventListener('click',e=>{

 if(e.target===$('overlay')){

  $('overlay').style.display='none';

 }

});


$('interact').onclick=()=>{

 if(!selectedObject)return;

 selectedObject.discovered=true;

 $('interact').textContent='OBJEVENO ✓';

 $('objectDescription').textContent=
 'Úspěšně jsi objevil: '+selectedObject.name+
 '. Tato oblast byla zaznamenána do tvého průzkumu.';

 showToast('NOVÝ OBJEV: '+selectedObject.name);

 updateNearby();

};


// ==========================================
// 7. RADAR
// ==========================================

function updateRadar(){

 const radar=$('radar');

 radar.querySelectorAll('.radar-dot').forEach(dot=>dot.remove());

 if(!player)return;

 objects.forEach(obj=>{

  const dist=distanceBetween(player,obj.coords);

  if(dist>1200)return;

  const dx=(obj.coords[0]-player[0])*
   111320*Math.cos(player[1]*Math.PI/180);

  const dy=(obj.coords[1]-player[1])*111320;

  const x=40+(dx/1200)*34;

  const y=38-(dy/1200)*34;

  const dot=document.createElement('div');

  dot.className='radar-dot';

  if(obj.kind==='portal'){
   dot.style.background='#d58cff';
   dot.style.boxShadow='0 0 8px #c46aff';
  }

  dot.style.left=x+'px';

  dot.style.top=y+'px';

  radar.appendChild(dot);

 });

}


function updateNearby(){

 if(!player)return;

 const nearby=objects.filter(obj=>
  distanceBetween(player,obj.coords)<500
 );

 $('nearby').textContent=
 'V okolí: '+nearby.length+
 ' objektů • '+objects.filter(o=>o.discovered).length+
 ' objeveno';

}


// ==========================================
// 8. OVLÁDÁNÍ KAMERY
// ==========================================

$('btn3d').onclick=()=>{

 is3D=!is3D;

 map.easeTo({
  pitch:is3D?58:0,
  duration:800
 });

 $('btn3d').textContent=is3D?'3D':'2D';

};


$('btnNorth').onclick=()=>{

 map.easeTo({
  bearing:0,
  duration:700
 });

};


$('btnZoomIn').onclick=()=>{

 map.zoomTo(map.getZoom()+1,{duration:300});

};


$('btnZoomOut').onclick=()=>{

 map.zoomTo(map.getZoom()-1,{duration:300});

};


$('btnLocate').onclick=()=>{

 following=true;

 if(player){

  map.flyTo({
   center:player,
   zoom:17,
   pitch:is3D?58:0,
   duration:1000
  });

 }

 startGPS();

};


$('btnRefresh').onclick=()=>{

 if(player){

  generateWorld();

 }else{

  startGPS();

 }

};


map.on('dragstart',()=>{

 following=false;

});


// ==========================================
// 9. START HRY
// ==========================================

map.on('load',()=>{

 $('worldStatus').textContent='MAP READY';

 if(navigator.geolocation){

  startGPS();

 }else{

  showToast('Tento prohlížeč nepodporuje GPS.');

 }

});


// Když se vrátíš do aplikace.

document.addEventListener('visibilitychange',()=>{

 if(!document.hidden && player && following){

  map.easeTo({
   center:player,
   duration:500
  });

 }

});

</script>
</body>
</html>
