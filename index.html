
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#142c25">
<title>REALM GO 0.6</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#b8d9b2;
  font-family:Arial,sans-serif;
}
#map{position:absolute;inset:0}
#avatarCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:5;
}
#loading{
  position:absolute;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  color:white;text-align:center;
  background:radial-gradient(circle at 50% 35%,#315b48,#10241f 75%);
  transition:opacity .6s;
}
#loading.hidden{opacity:0;pointer-events:none}
.logo{
  font-size:38px;font-weight:900;letter-spacing:5px;
  text-shadow:0 0 20px #7dffba;
}
.logo span{color:#9cffbb}
.loading-sub{font-size:11px;letter-spacing:4px;margin-top:9px;color:#b7e8c8}
.loader{
  width:46px;height:46px;border:3px solid #ffffff30;
  border-top-color:#a8ffb8;border-radius:50%;
  animation:spin 1s linear infinite;margin-top:35px;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingText{font-size:12px;color:#c7e9d0;margin-top:15px}
#topbar{
  position:absolute;z-index:20;top:env(safe-area-inset-top,10px);
  left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;
}
.panel{
  color:white;
  background:linear-gradient(135deg,#173b30ed,#10251feb);
  border:1px solid #a5f5c55c;
  border-radius:15px;padding:10px 13px;
  box-shadow:0 5px 20px #10251f40;
  backdrop-filter:blur(12px);
}
#playerInfo{font-size:12px;line-height:1.6}
#playerInfo strong{font-size:15px;color:#a9ffc0}
#level{font-size:11px;color:#d5eadb}
#compass{font-size:22px}
#bottom{
  position:absolute;z-index:20;bottom:calc(15px + env(safe-area-inset-bottom));
  left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:end;
  pointer-events:none;
}
#bottom .panel{pointer-events:auto}
#locationStatus{font-size:11px;color:#ccebd6;max-width:190px}
.actions{display:flex;gap:9px}
.action{
  width:49px;height:49px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:white;
  background:linear-gradient(145deg,#285943,#102b23);
  border:1px solid #a5f5c5a0;
  box-shadow:0 4px 14px #0004;
  cursor:pointer;
}
.action:active{transform:scale(.93)}
#gpsButton{
  position:absolute;z-index:25;right:14px;top:90px;
  width:44px;height:44px;border-radius:14px;
  border:1px solid #ffffff70;background:#173b30e8;
  color:white;font-size:21px;
}
#zoomControls{
  position:absolute;z-index:25;right:14px;top:145px;
  display:flex;flex-direction:column;gap:6px;
}
.zoom{
  width:42px;height:42px;border-radius:12px;
  border:1px solid #ffffff70;background:#173b30e8;
  color:white;font-size:23px;
}
.item-marker{
  width:46px;height:54px;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:29px;
  filter:drop-shadow(0 5px 3px #263c2c88);
  transform-origin:bottom center;
}
.item-marker .item-shadow{
  position:absolute;bottom:0;left:9px;width:28px;height:7px;
  border-radius:50%;background:#263c2c66;
  z-index:-1;
}
.item-marker .item-symbol{
  position:relative;z-index:1;
  text-shadow:0 2px 3px #263c2c;
}
#message{
  position:absolute;z-index:30;top:85px;left:50%;
  transform:translateX(-50%);
  padding:10px 15px;border-radius:12px;
  background:#173b30ed;color:white;font-size:12px;
  border:1px solid #a5f5c5;
  opacity:0;pointer-events:none;transition:opacity .3s;
  max-width:85%;text-align:center;
}
#message.show{opacity:1}
#debug{
  display:none;position:absolute;z-index:200;
  left:10px;right:10px;top:50%;
  transform:translateY(-50%);
  padding:16px;border-radius:12px;
  background:#2c1515ed;color:white;
  font-size:12px;line-height:1.5;
  overflow-wrap:anywhere;
}
#debug button{
  margin-top:12px;padding:9px 14px;
  background:#a9ffc0;border:0;border-radius:8px;
}
#crosshair{
  position:absolute;z-index:4;left:50%;top:50%;
  width:5px;height:5px;border-radius:50%;
  background:#ffffff80;pointer-events:none;
}
</style>
</head>

<body>

<div id="map"></div>
<canvas id="avatarCanvas"></canvas>
<div id="crosshair"></div>

<div id="loading">
  <div class="logo">REALM <span>GO</span></div>
  <div class="loading-sub">EXPLORE THE LIVING WORLD</div>
  <div class="loader"></div>
  <div id="loadingText">Připravuji herní svět...</div>
</div>

<div id="topbar">
  <div class="panel" id="playerInfo">
    <strong>CESTOVATEL</strong><br>
    <span id="level">ÚROVEŇ 1 · 0 XP</span>
  </div>
  <div class="panel" id="compass">🧭</div>
</div>

<button id="gpsButton" title="Moje poloha">◎</button>
<div id="zoomControls">
  <button class="zoom" id="zoomIn">+</button>
  <button class="zoom" id="zoomOut">−</button>
</div>

<div id="message"></div>

<div id="bottom">
  <div class="panel">
    <div id="locationStatus">Čekám na GPS...</div>
  </div>
  <div class="actions">
    <button class="action" id="inventoryButton">🎒</button>
    <button class="action" id="worldButton">🌍</button>
  </div>
</div>

<div id="debug">
  <strong>REALM GO – diagnostika</strong>
  <div id="debugText"></div>
  <button onclick="location.reload()">Zkusit znovu</button>
</div>

<!-- Knihovny se načítají jako klasické skripty, ne jako ES moduly -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

<script>
(function(){

"use strict";

const $ = id => document.getElementById(id);

let map = null;
let renderer = null;
let scene = null;
let camera = null;
let avatar = null;
let avatarParts = {};
let playerPosition = null;
let lastPosition = null;
let heading = 0;
let walkAmount = 0;
let isWalking = false;
let mapReady = false;
let avatarReady = false;
let xp = 0;
let level = 1;
let markers = [];

const initialCenter = [14.7,49.3];

function showMessage(text){
  const el=$("message");
  el.textContent=text;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2600);
}

function hideLoading(text){
  $("loadingText").textContent=text || "Svět je připraven!";
  $("loading").classList.add("hidden");
  setTimeout(()=>$("loading").style.display="none",700);
}

function showError(text){
  $("debugText").textContent=text;
  $("debug").style.display="block";
  hideLoading("Hra pokračuje v omezeném režimu");
}

window.addEventListener("error",e=>{
  console.error(e);
  if(!mapReady && !map){
    showError("Chyba při spuštění: "+(e.message||"Neznámá chyba"));
  }
});

window.addEventListener("unhandledrejection",e=>{
  console.error(e.reason);
});

function updateXP(amount){
  xp+=amount;
  const next=level*100;
  while(xp>=next){
    xp-=next;
    level++;
    showMessage("✨ Nová úroveň: "+level);
  }
  $("level").textContent="ÚROVEŇ "+level+" · "+xp+" XP";
}

/* MAPA */

function startMap(){

  if(typeof maplibregl==="undefined"){
    showError("MapLibre se nepodařilo načíst. Zkontroluj internetové připojení nebo CDN.");
    return;
  }

  try{

    map=new maplibregl.Map({
      container:"map",
      style:"https://tiles.openfreemap.org/styles/bright",
      center:initialCenter,
      zoom:16,
      pitch:48,
      bearing:0,
      antialias:true,
      attributionControl:false
    });

    map.addControl(new maplibregl.AttributionControl({
      compact:true
    }));

    map.on("load",()=>{
      mapReady=true;
      $("loadingText").textContent="Načítám živý svět...";
      addWorldItems();
      hideLoading("Vítej v REALM GO!");
      $("locationStatus").textContent="Mapa připravena · Čekám na GPS";
    });

    map.on("error",e=>{
      console.warn("Map error:",e.error||e);
      if(!mapReady){
        $("loadingText").textContent="Načítám mapové podklady...";
      }
    });

  }catch(e){
    showError("Mapu se nepodařilo spustit: "+e.message);
  }
}

/* PŘEDMĚTY VE SVĚTĚ */

function addItem(lng,lat,emoji,name){

  if(!map)return;

  const element=document.createElement("div");
  element.className="item-marker";
  element.innerHTML=
    '<span class="item-symbol">'+emoji+'</span>'+
    '<span class="item-shadow"></span>';

  const marker=new maplibregl.Marker({
    element:element,
    anchor:"bottom"
  }).setLngLat([lng,lat]).addTo(map);

  element.addEventListener("click",()=>{
    showMessage(name+" – nalezen předmět!");
    updateXP(10);
    marker.remove();
  });

  markers.push(marker);
}

function addWorldItems(){

  // Ukázkové herní předměty poblíž středu mapy.
  // Jsou ukotvené v geografických souřadnicích.
  const center=map.getCenter();

  const items=[
    {dx:0.00045,dy:0.00035,e:"💎",n:"Krystal energie"},
    {dx:-0.00055,dy:0.00025,e:"🌿",n:"Bylina života"},
    {dx:0.00030,dy:-0.00055,e:"🪙",n:"Starověká mince"},
    {dx:-0.00040,dy:-0.00045,e:"✨",n:"Magická esence"},
    {dx:0.00075,dy:0.00010,e:"📦",n:"Tajemná schránka"}
  ];

  items.forEach(item=>{
    addItem(
      center.lng+item.dx,
      center.lat+item.dy,
      item.e,
      item.n
    );
  });
}

/* THREE.JS – 3D AVATAR */

function createAvatar(){

  if(typeof THREE==="undefined"){
    console.warn("Three.js není dostupné. Mapa poběží bez 3D avatara.");
    return;
  }

  try{

    const canvas=$("avatarCanvas");

    renderer=new THREE.WebGLRenderer({
      canvas:canvas,
      alpha:true,
      antialias:true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setClearColor(0x000000,0);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;

    scene=new THREE.Scene();

    camera=new THREE.OrthographicCamera(
      -window.innerWidth/2,
      window.innerWidth/2,
      window.innerHeight/2,
      -window.innerHeight/2,
      0.1,
      1000
    );

    camera.position.set(0,0,100);
    camera.lookAt(0,0,0);

    scene.add(new THREE.AmbientLight(0xffffff,1.5));

    const sun=new THREE.DirectionalLight(0xffffff,2.0);
    sun.position.set(-50,80,100);
    scene.add(sun);

    const fill=new THREE.DirectionalLight(0x8bdcff,0.7);
    fill.position.set(60,10,60);
    scene.add(fill);

    avatar=new THREE.Group();
    scene.add(avatar);

    const green=new THREE.MeshStandardMaterial({
      color:0x25864b,roughness:0.85
    });

    const darkGreen=new THREE.MeshStandardMaterial({
      color:0x12472e,roughness:0.9
    });

    const skin=new THREE.MeshStandardMaterial({
      color:0xe9b98c,roughness:0.8
    });

    const leather=new THREE.MeshStandardMaterial({
      color:0x70452b,roughness:0.9
    });

    const gold=new THREE.MeshStandardMaterial({
      color:0xf5ca55,metalness:0.6,roughness:0.35
    });

    const bootMat=new THREE.MeshStandardMaterial({
      color:0x30251d,roughness:0.9
    });

    function mesh(geometry,material,parent,x,y,z){
      const m=new THREE.Mesh(geometry,material);
      m.position.set(x,y,z);
      m.castShadow=true;
      m.receiveShadow=true;
      parent.add(m);
      return m;
    }

    // Stín pod nohama
    const shadow=mesh(
      new THREE.CircleGeometry(19,32),
      new THREE.MeshBasicMaterial({
        color:0x17251c,transparent:true,opacity:0.35
      }),
      avatar,0,2,-5
    );
    shadow.scale.set(1.5,0.42,1);

    // Plášť
    const cape=mesh(
      new THREE.ConeGeometry(17,48,8),
      darkGreen,avatar,0,38,-3
    );
    cape.rotation.x=Math.PI;

    // Tělo
    const body=mesh(
      new THREE.CapsuleGeometry(10,19,5,10),
      green,avatar,0,48,3
    );

    // Hrudní pás
    const belt=mesh(
      new THREE.BoxGeometry(19,5,5),
      leather,avatar,0,42,11
    );

    // Batoh
    const backpack=mesh(
      new THREE.BoxGeometry(15,19,9),
      leather,avatar,0,53,-8
    );

    // Hlava
    const head=mesh(
      new THREE.SphereGeometry(10,24,20),
      skin,avatar,0,76,5
    );

    // Kapuce
    const hood=mesh(
      new THREE.SphereGeometry(12,24,18,0,Math.PI*2,0,Math.PI*0.65),
      darkGreen,avatar,0,80,2
    );

    // Tvář – oči
    const eyeMat=new THREE.MeshBasicMaterial({color:0x25251c});
    mesh(new THREE.SphereGeometry(1.25,8,8),eyeMat,avatar,-3,76,14);
    mesh(new THREE.SphereGeometry(1.25,8,8),eyeMat,avatar,3,76,14);

    // Ramena
    mesh(new THREE.SphereGeometry(6,12,12),green,avatar,-12,57,3);
    mesh(new THREE.SphereGeometry(6,12,12),green,avatar,12,57,3);

    // Ruce na otočných kloubech
    const leftArm=new THREE.Group();
    leftArm.position.set(-13,55,4);
    avatar.add(leftArm);

    mesh(new THREE.CapsuleGeometry(4,15,4,8),green,leftArm,0,-10,0);

    const rightArm=new THREE.Group();
    rightArm.position.set(13,55,4);
    avatar.add(rightArm);

    mesh(new THREE.CapsuleGeometry(4,15,4,8),green,rightArm,0,-10,0);

    // Nohy
    const leftLeg=new THREE.Group();
    leftLeg.position.set(-6,31,4);
    avatar.add(leftLeg);

    mesh(new THREE.CapsuleGeometry(4,13,4,8),leather,leftLeg,0,-9,0);

    const leftBoot=mesh(
      new THREE.BoxGeometry(10,7,15),
      bootMat,leftLeg,0,-20,4
    );

    const rightLeg=new THREE.Group();
    rightLeg.position.set(6,31,4);
    avatar.add(rightLeg);

    mesh(new THREE.CapsuleGeometry(4,13,4,8),leather,rightLeg,0,-9,0);

    const rightBoot=mesh(
      new THREE.BoxGeometry(10,7,15),
      bootMat,rightLeg,0,-20,4
    );

    // Zlatý znak na hrudi
    const emblem=mesh(
      new THREE.OctahedronGeometry(4),
      gold,avatar,0,53,13
    );

    // Plášť a batoh
    avatarParts={
      leftArm,rightArm,leftLeg,rightLeg,
      cape,shadow,body,head
    };

    avatar.scale.set(1,1,1);
    avatarReady=true;

  }catch(e){
    console.error("Avatar error:",e);
    avatarReady=false;
  }
}

/* GPS */

function startGPS(){

  if(!navigator.geolocation){
    showMessage("Tento prohlížeč nepodporuje GPS.");
    return;
  }

  $("locationStatus").textContent="Zjišťuji polohu...";

  navigator.geolocation.getCurrentPosition(
    position=>{
      handlePosition(position);
      navigator.geolocation.watchPosition(
        handlePosition,
        gpsError,
        {
          enableHighAccuracy:true,
          maximumAge:3000,
          timeout:20000
        }
      );
    },
    gpsError,
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:20000
    }
  );
}

function handlePosition(position){

  const lng=position.coords.longitude;
  const lat=position.coords.latitude;

  if(!Number.isFinite(lng)||!Number.isFinite(lat))return;

  playerPosition=[lng,lat];

  if(lastPosition){

    const dx=lng-lastPosition[0];
    const dy=lat-lastPosition[1];

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance>0.000002){
      heading=Math.atan2(dx,dy);
      isWalking=true;
    }else{
      isWalking=false;
    }
  }

  lastPosition=[lng,lat];

  $("locationStatus").textContent=
    "GPS aktivní · přesnost "+Math.round(position.coords.accuracy)+" m";

  if(map){
    if(!mapReady)return;

    if(!window.playerCentered){
      map.flyTo({
        center:playerPosition,
        zoom:18,
        pitch:55,
        duration:1800
      });
      window.playerCentered=true;
    }
  }
}

function gpsError(error){

  const messages={
    1:"Povol přístup k poloze v prohlížeči.",
    2:"GPS poloha není dostupná.",
    3:"GPS odpověděla příliš pozdě."
  };

  $("locationStatus").textContent=
    messages[error.code]||"GPS se nepodařilo spustit.";

  showMessage(messages[error.code]||"Chyba GPS");
}

/* UMÍSTĚNÍ AVATARA */

function updateAvatar(){

  if(!avatarReady||!playerPosition||!map||!mapReady)return;

  const p=map.project(playerPosition);

  avatar.position.set(
    p.x-window.innerWidth/2,
    window.innerHeight/2-p.y,
    0
  );

  avatar.rotation.z=-heading;

  const t=performance.now()*0.008;

  if(isWalking){
    avatarParts.leftLeg.rotation.x=Math.sin(t)*0.45;
    avatarParts.rightLeg.rotation.x=-Math.sin(t)*0.45;
    avatarParts.leftArm.rotation.x=-Math.sin(t)*0.35;
    avatarParts.rightArm.rotation.x=Math.sin(t)*0.35;
    avatar.position.y+=Math.abs(Math.sin(t*2))*2;
  }else{
    avatarParts.leftLeg.rotation.x=0;
    avatarParts.rightLeg.rotation.x=0;
    avatarParts.leftArm.rotation.x=0;
    avatarParts.rightArm.rotation.x=0;
    avatar.position.y+=Math.sin(t*0.4)*1.2;
  }
}

function animate(){

  requestAnimationFrame(animate);

  if(renderer&&scene&&camera){
    updateAvatar();
    renderer.render(scene,camera);
  }
}

/* OVLÁDÁNÍ */

$("gpsButton").addEventListener("click",()=>{
  if(playerPosition&&map){
    map.flyTo({
      center:playerPosition,
      zoom:18,
      pitch:55,
      duration:1200
    });
  }else{
    startGPS();
  }
});

$("zoomIn").addEventListener("click",()=>{
  if(map)map.zoomIn();
});

$("zoomOut").addEventListener("click",()=>{
  if(map)map.zoomOut();
});

$("inventoryButton").addEventListener("click",()=>{
  showMessage("🎒 Batoh – zatím prázdný");
});

$("worldButton").addEventListener("click",()=>{
  if(map){
    map.easeTo({pitch:55,duration:900});
    showMessage("🌍 Vítej v živém světě REALM GO");
  }
});

window.addEventListener("resize",()=>{
  if(!renderer||!camera)return;

  renderer.setSize(window.innerWidth,window.innerHeight);

  camera.left=-window.innerWidth/2;
  camera.right=window.innerWidth/2;
  camera.top=window.innerHeight/2;
  camera.bottom=-window.innerHeight/2;
  camera.updateProjectionMatrix();
});

/* SPUŠTĚNÍ */

function boot(){

  $("loadingText").textContent="Načítám mapový engine...";

  startMap();

  $("loadingText").textContent="Vytvářím 3D postavu...";

  createAvatar();

  animate();

  // GPS spustíme po otevření aplikace.
  startGPS();

  // Záchranná pojistka: načítací obrazovka nesmí zůstat navždy.
  setTimeout(()=>{
    if(!$("loading").classList.contains("hidden")){
      hideLoading("Svět se načítá na pozadí...");
    }
  },12000);
}

boot();

})();
</script>

</body>
</html>
